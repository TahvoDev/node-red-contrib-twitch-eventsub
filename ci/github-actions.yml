# GitHub Actions workflow.
#
# This file lives in ci/ (not .github/workflows/) because the token used to open
# the security PR does not have the GitHub App `workflows` permission, so GitHub
# refuses a push that creates a workflow file. It is the exact workflow that
# should run: copy it to .github/workflows/ci.yml to activate it (or push it once
# the app has `workflows: write`). `npm run check` runs the same gates locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck (strict, noImplicitAny)
        run: npm run typecheck
      - name: Lint (eslint-plugin-security)
        run: npm run lint
      - name: Forbidden-pattern sink check
        run: node scripts/check-forbidden-patterns.js
      - name: Build + unit tests
        run: npm run build
      - name: Security coverage (>=90% lines/functions)
        run: npm run test:coverage
      - name: npm audit (runtime deps)
        run: npm run audit

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install semgrep
      - name: Semgrep security audit
        run: semgrep scan --config p/security-audit --config p/secrets --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
