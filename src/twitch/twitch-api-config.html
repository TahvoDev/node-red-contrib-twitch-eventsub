<script type="text/javascript">
// Wrapped, because Node-RED evaluates every node's editor script in the one page
// scope: a top-level `let` here would collide with the same name in any other
// node type's script and throw before either registered.
(function () {
// Per-dialog teardown, so a cancelled *new* node — which the editor hands a
// throwaway `{id}` instead of the object the dialog was opened on — still releases
// the subscription this dialog opened.
let releaseActiveStatus = function () {};

RED.nodes.registerType('twitch-api-config', {
  category: 'config',
  defaults: {
    name: { value: '', required: true },
    twitch_client_id: { required: false },
    twitch_user_id: { value: '' },
    twitch_user_login: { value: '' },
    twitch_mock_server_port: { value: '' },
    twitch_mock_user_id: { value: '' },
    twitch_mock_token: { value: '' },
  },
  credentials: {
    twitch_client_secret: { type: 'password' },
    twitch_refresh_token: { type: 'password' },
  },
  inputs: 0,
  outputs: 0,
  label: function () {
    return this.name;
  },
  oneditprepare: function () {
    const node = this;
    let pollInterval = null;
    let unsubStatus = null;

    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    function setAuthStatus(text, state) {
      const el = $('#twitch-auth-status');
      el
        .removeClass('auth-ok auth-warn auth-wait auth-err')
        .addClass(state || '')
        .text(text);
    }

    // --- Runtime status ---
    //
    // The node's own status is the only claim here that means anything: it is
    // what the runtime published over the retained status/<id> message after a
    // real token check, and this dialog has no way to verify anything itself.
    // "Logged in as X" from the saved fields was a guess dressed as a fact, and
    // it stayed green while the canvas showed red.
    const FILL_CLASS = {
      green: 'auth-ok',
      yellow: 'auth-wait',
      red: 'auth-err',
      grey: 'auth-warn',
      blue: 'auth-wait',
    };

    // Comms callbacks get the raw message; only the editor's own status/# handler
    // translates, so do it here rather than depend on handler ordering.
    //
    // Only key-shaped text goes to the translator. i18next reads a colon as a
    // namespace separator, and status text routinely carries one — "Mock server
    // :8080", "WebSocket error: …", "Disconnected: …" — so passing those through
    // would look them up as namespace "Mock server " and throw the wording away.
    // Wording we did not add, such as a third-party error message, is shown as-is.
    const I18N_KEY = /^[^:\s]+:[^:\s]+$/;

    function translate(text) {
      const value = text == null ? '' : String(text);
      if (!I18N_KEY.test(value)) return value;
      return node._(value, { defaultValue: value });
    }

    function renderRuntimeStatus(status) {
      if (!status || status.text == null) return false;
      setAuthStatus(translate(status.text), FILL_CLASS[status.fill] || 'auth-warn');
      return true;
    }

    // The runtime publishes nothing before the first user node starts, and keeps
    // nothing across a restart, so this is also a config node with no users. Both
    // mean the same thing to the reader: nothing is connected.
    function showNoRuntimeStatus() {
      setAuthStatus('Not connected', 'auth-warn');
    }

    function subscribeToStatus() {
      // The editor routes retained status messages through RED.nodes.node(id) for
      // config nodes too, so the wrapper already carries the current one.
      renderRuntimeStatus(node.status) || showNoRuntimeStatus();

      // Registered before the guard: even with no comms to subscribe to, this
      // dialog is the one that must be released.
      releaseActiveStatus = releaseStatus;
      if (!RED.comms || !RED.comms.subscribe) return;

      unsubStatus = function (topic, status) {
        renderRuntimeStatus(status);
      };
      RED.comms.subscribe('status/' + node.id, unsubStatus);
    }

    // Esc and the dialog close button bypass click handlers, so the hooks are the
    // only teardown that always runs. Unsubscribe with the same function reference
    // that was subscribed.
    function releaseStatus() {
      if (unsubStatus && RED.comms && RED.comms.unsubscribe) {
        RED.comms.unsubscribe('status/' + node.id, unsubStatus);
      }
      unsubStatus = null;
    }

    // Saved-account facts, kept out of the status line: a stored id is what is in
    // the config, not proof that it still works.
    function showSavedAccount() {
      if (node.twitch_user_id || node.twitch_user_login) {
        $('#twitch-saved-account')
          .text(
            'Token saved for ' +
              (node.twitch_user_login || node.twitch_user_id) +
              (node.twitch_user_id ? ' (' + node.twitch_user_id + ')' : '')
          )
          .show();
      }
    }

    // Node-RED never sends a stored password back to the editor: it fills the
    // field with this placeholder, which oneditsave reads as "keep what is
    // saved". There is no secret to check in that case, so verification is
    // skipped rather than posting the placeholder to Twitch.
    const SAVED_SECRET = '__PWRD__';

    $('#node-config-btn-twitch-auth').click(function () {
      const $clientId = $('#node-config-input-twitch_client_id');
      const clientId = ($clientId.val() || '').trim();
      const clientSecret = ($('#node-config-input-twitch_client_secret').val() || '').trim();

      if (!clientId || !clientSecret) {
        RED.notify('Please enter a Client ID and Client Secret first.', 'error');
        return;
      }

      // Pasted ids often carry a stray newline, and a secret typed over the saved
      // one is otherwise never used until a runtime refresh, so check the pair now.
      $clientId.val(clientId);
      $('#node-config-input-twitch_client_secret').val(clientSecret);

      if (clientSecret === SAVED_SECRET) {
        loadScopes(clientId);
        return;
      }

      setAuthStatus('Checking credentials…', 'auth-wait');

      $.ajax({
        url: 'twitch-eventsub/auth/verify',
        type: 'POST',
        data: { client_id: clientId, client_secret: clientSecret },
        success: function () {
          loadScopes(clientId);
        },
        error: function (xhr) {
          // 400 and 401 are the route's answers for a pair Twitch refused: the
          // runtime reads the same two as a refused token, and a 401 labelled
          // "Could not reach Twitch" would be nonsense. Anything else is Twitch
          // being unreachable, rate limiting or the runtime restarting under us,
          // and calling that a bad secret sends people off to re-copy it.
          const refused = xhr.status === 400 || xhr.status === 401;
          setAuthStatus(
            refused
              ? 'Client ID or Client Secret is not valid'
              : `Could not reach Twitch (${xhr.status || 0})`,
            'auth-err'
          );
        },
      });
    });

    function loadScopes(clientId) {
      // The scopes come from the Helix specs at build time, so the login button
      // always requests exactly what the palette's nodes need.
      $.ajax({
        url: 'twitch-eventsub/helix/scopes',
        type: 'GET',
        success: function (resp) {
          startDeviceAuth(clientId, ((resp && resp.scopes) || []).join(' '));
        },
        error: function () {
          startDeviceAuth(clientId, '');
        },
      });
    }

    function startDeviceAuth(clientId, scopes) {
      $.ajax({
        url: 'twitch-eventsub/auth/device',
        type: 'POST',
        data: { client_id: clientId, scopes },
        success: function (resp) {
          $('#auth-step-login').hide();
          $('#auth-step-verify').show();

          $('#twitch-auth-link')
            .attr('href', resp.verification_uri)
            .text(resp.verification_uri);

          $('#twitch-user-code').text(resp.user_code);

          setAuthStatus('Waiting for Twitch authorization…', 'auth-wait');
          startPolling(clientId, resp.device_code, resp.interval);
        },
        error: function (xhr) {
          RED.notify('Auth start failed: ' + xhr.responseText, 'error');
        },
      });
    }

    function startPolling(clientId, deviceCode, intervalSeconds) {
      stopPolling();
      pollInterval = setInterval(function () {
        $.ajax({
          url: 'twitch-eventsub/auth/token',
          type: 'POST',
          data: { client_id: clientId, device_code: deviceCode },
          success: function (resp) {
            if (resp.refresh_token) {
              stopPolling();

              $('#node-config-input-twitch_refresh_token').val(resp.refresh_token);
              $('#node-config-input-twitch_user_id').val(resp.twitch_user_id);
              $('#node-config-input-twitch_user_login').val(resp.twitch_user_login);

              // A new token is saved to the form, not to the running node: the
              // runtime only sees it on Deploy. Say that, rather than claiming a
              // connection that does not exist yet.
              setAuthStatus('Connected — deploy to use it', 'auth-ok');

              $('#twitch-saved-account')
                .text('Token saved for ' + resp.twitch_user_login + ' (' + resp.twitch_user_id + ')')
                .show();

              $('#auth-step-verify').hide();
              $('#auth-step-login').show();
            }
          },
          error: function (xhr) {
            const err = JSON.parse(xhr.responseText || '{}');
            if (err.message !== 'authorization_pending' && err.message !== 'slow_down') {
              stopPolling();
              setAuthStatus('Authentication failed', 'auth-warn');
              $('#auth-step-verify').hide();
              $('#auth-step-login').show();
            }
          },
        });
      }, intervalSeconds * 1000 + 200);
    }

    $('#node-config-dialog-cancel').click(stopPolling);
    $('#node-config-dialog-ok').click(stopPolling);

    subscribeToStatus();
    showSavedAccount();
  },
  oneditsave: function () {
    releaseActiveStatus();
  },
  oneditcancel: function () {
    releaseActiveStatus();
  },
  oneditdelete: function () {
    releaseActiveStatus();
  },
});
})();
</script>

<style>
  .red-ui-editor .form-row label, .red-ui-editor-dialog .form-row label {
    width: 130px;
  }
  .twitch-api-config-form a {
    color: #55aaea;
    text-decoration: underline;
  }
  .twitch-api-config-form a:hover {
    text-decoration: underline;
  }
  /* Two classes: the editor's own `.red-ui-editor-dialog p` margin rule is more
     specific than a lone class, so this would lose without them. The 134px is the
     130px label width plus the whitespace gap before the input. */
  .twitch-api-config-form .twitch-get-creds {
    margin: 14px 0 8px 134px;
  }
  .auth-box {
    background: #f3f3f3;
    border: 1px solid #dcdcdc;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 10px;
    text-align: center;
  }
  .code-display {
    font-family: monospace;
    font-size: 1.5em;
    font-weight: bold;
    color: #9146FF;
    margin: 10px 0;
    display: block;
    letter-spacing: 2px;
  }
  .auth-status {
    margin-top: 10px;
    font-weight: bold;
  }
  /* The shape carries the meaning here: Node-RED readers judge connection state
     from ring vs dot, so colour alone would read as "looks fine". Connected is
     the only state drawn as a filled dot. */
  .auth-status::before {
    content: '';
    display: inline-block;
    width: 9px;
    height: 9px;
    border: 2px solid currentColor;
    border-radius: 50%;
    margin-right: 6px;
  }
  .auth-ok::before { background: currentColor; }
  /* A fact about the saved config, not the connection state, so it is quiet. */
  .auth-saved-account {
    font-size: 0.9em;
    opacity: 0.75;
    margin-top: 2px;
  }
  .auth-ok { color: #2ca02c; }
  .auth-warn { color: #999; }
  .auth-err { color: #c00; }
  .auth-wait { color: #ff7f0e; }
</style>

<script type="text/html" data-template-name="twitch-api-config">
  <div class="twitch-api-config-form">

    <div class="form-row">
      <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
      <input type="text" id="node-config-input-name">
    </div>

    <p class="red-ui-help twitch-get-creds">
      Create an app at
      <a href="https://dev.twitch.tv/console/apps" target="_blank" rel="noopener">dev.twitch.tv/console/apps</a>
      and paste its Client ID and Client Secret below, then connect.
    </p>

    <div class="form-row">
      <label for="node-config-input-twitch_client_id">
        <i class="fa fa-key"></i> Client ID
      </label>
      <input type="text" id="node-config-input-twitch_client_id">
    </div>

    <div class="form-row">
      <label for="node-config-input-twitch_client_secret">
        <i class="fa fa-lock"></i> Client Secret
      </label>
      <input type="password" id="node-config-input-twitch_client_secret">
    </div>

    <hr>

    <div class="auth-box">
      <div id="auth-step-login">
        <a class="red-ui-button" id="node-config-btn-twitch-auth">
          <i class="fa fa-twitch"></i> Connect to Twitch
        </a>
      </div>

      <div id="auth-step-verify" style="display:none;">
        <p>Open: <a id="twitch-auth-link" target="_blank">Twitch activation page</a></p>
        <p>Enter code:</p>
        <div id="twitch-user-code" class="code-display">----</div>
        <p><i class="fa fa-spinner fa-spin"></i> Waiting for approval…</p>
      </div>

      <!-- Outside both steps: the device flow hides the login step while it waits
           for approval, and "Waiting for Twitch authorization…" is the message the
           user needs to see while that is happening. -->
      <div id="twitch-auth-status" class="auth-status">Not connected</div>
      <div id="twitch-saved-account" class="auth-saved-account" style="display:none;"></div>
    </div>

    <input type="hidden" id="node-config-input-twitch_user_id">
    <input type="hidden" id="node-config-input-twitch_user_login">

    <!-- Not a manual entry: the device flow writes the refresh token it gets back
         into this field, and the runtime reads it from there. Hidden for the same
         reason the ids above it are. -->
    <input type="hidden" id="node-config-input-twitch_refresh_token">

    <details style="margin-top:10px;">
      <summary>Mock server (local testing)</summary>
      <p class="red-ui-help">
        Points Twurple at a local <a href="https://github.com/twitchdev/twitch-cli" target="_blank">Twitch CLI</a>
        mock instead of Twitch, so events can be triggered offline. Fill in the
        <b>port</b> and the normal Client ID / login above are ignored.
        Start the mock with <code>twitch mock-api start</code> and
        <code>twitch event websocket start-server</code> behind a single port
        (Twurple sends Helix, subscription and WebSocket traffic to one port).
      </p>
      <div class="form-row">
        <label for="node-config-input-twitch_mock_server_port">
          <i class="fa fa-server"></i> Mock Port
        </label>
        <input type="text" id="node-config-input-twitch_mock_server_port" placeholder="8080">
      </div>
      <div class="form-row">
        <label for="node-config-input-twitch_mock_user_id">
          <i class="fa fa-user"></i> Mock User ID
        </label>
        <input type="text" id="node-config-input-twitch_mock_user_id" placeholder="printed by mock-api start">
      </div>
      <div class="form-row">
        <label for="node-config-input-twitch_mock_token">
          <i class="fa fa-key"></i> Mock Token
        </label>
        <input type="text" id="node-config-input-twitch_mock_token" placeholder="printed by mock-api start">
      </div>
    </details>

  </div>
</script>
