<script type="text/javascript">
  RED.nodes.registerType('twitch-eventsub-channel-stream-online', {
    category: 'twitch events',
    color: '#b9a3e3',
    defaults: {
      name: { value: "" },
      config: { value: "", type: "twitch-api-config", required: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: "stream online",
    label: function() {
      if (this.name) {
        return this.name;
      }
      else {
        var config = RED.nodes.node(this.config);
        return 'stream online' + (config ? ' (' + (config.name || '') + ')' : '');
      }
    },
  });
</script>

<script type="text/html" data-template-name="twitch-eventsub-channel-stream-online">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>

  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" placeholder="">
  </div>
</script>

<script type="text/html" data-help-name="twitch-eventsub-channel-stream-online">
    <h2>Twitch Stream Online</h2>
    <p>Triggers when a stream goes live on the configured Twitch channel.</p>

    <h3>Configuration</h3>
    <ul>
        <li><strong>Name</strong>: Optional name for the node</li>
        <li><strong>Config</strong>: Select your Twitch EventSub configuration</li>
    </ul>

    <h3>Output</h3>
    <p>Emits a message when the stream goes online. The <code>msg.payload</code> contains the perfectly aligned event map from Twurple:</p>

    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>
            <ul>
                <li>
                    <dt>id <i>string</i></dt>
                    <dd>The unique identifier for the Twitch stream.</dd>
                </li>
                <li>
                    <dt>broadcasterId <i>string</i></dt>
                    <dd>The Twitch user ID of the channel that went live.</dd>
                </li>
                <li>
                    <dt>broadcasterName <i>string</i></dt>
                    <dd>The Twitch login name of the broadcaster.</dd>
                </li>
                <li>
                    <dt>broadcasterDisplayName <i>string</i></dt>
                    <dd>The display name of the broadcaster.</dd>
                </li>
                <li>
                    <dt>startDate <i>Date</i></dt>
                    <dd>The exact date and time when the stream went online.</dd>
                </li>
                <li>
                    <dt>type <i>string</i></dt>
                    <dd>The type of the stream going live (e.g., "live", "playlist", "watch_party", "premiere", "rerun").</dd>
                </li>
            </ul>
        </dd>
    </dl>

    <h3>Example Usage</h3>
    <p>To announce a stream going live, connect this node to an action node (like a Discord webhook or chat bot) and format a message using <code>msg.payload.broadcasterDisplayName</code> and <code>msg.payload.type</code>.</p>
</script>
