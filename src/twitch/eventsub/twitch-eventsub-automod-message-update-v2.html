<script type="text/javascript">
  RED.nodes.registerType('twitch-eventsub-automod-message-update-v2', {
    category: 'twitch events',
    color: '#b9a3e3',
    defaults: {
      name:   { value: '' },
      config: { type: 'twitch-api-config', required: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'automod update v2',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'automod update v2' + (config ? ' (' + (config.name || '') + ')' : '');
    }
  });
</script>

<script type="text/html" data-template-name="twitch-eventsub-automod-message-update-v2">
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-eventsub-automod-message-update-v2">
  <p>Fires when a held AutoMod message is approved or denied (v2 payload).</p>
  <p><b>Note:</b> this subscription is made with the broadcaster as both broadcaster and moderator, so only actions performed by the broadcaster themself are reported.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      <ul>
        <li><code>broadcasterId</code> - <i>string</i></li>
        <li><code>broadcasterName</code> - <i>string</i></li>
        <li><code>broadcasterDisplayName</code> - <i>string</i></li>
        <li><code>moderatorId</code> - <i>string</i></li>
        <li><code>moderatorName</code> - <i>string</i></li>
        <li><code>moderatorDisplayName</code> - <i>string</i></li>
        <li><code>userId</code> - <i>string</i></li>
        <li><code>userName</code> - <i>string</i></li>
        <li><code>userDisplayName</code> - <i>string</i></li>
        <li><code>messageId</code> - <i>string</i></li>
        <li><code>messageText</code> - <i>string</i></li>
        <li><code>messageParts</code> - <i>AutoModMessagePart[]</i></li>
        <li><code>reason</code> - <i>AutoModMessageHoldReason</i></li>
        <li><code>autoMod</code> - <i>AutoModMessageAutoMod | null</i></li>
        <li><code>blockedTerms</code> - <i>AutoModMessageBlockedTerm[] | null</i></li>
        <li><code>status</code> - <i>AutoModResolutionStatus</i></li>
        <li><code>holdDate</code> - <i>Date</i></li>
        <li><code>rawEvent</code> - <i>object</i> - the full unmodified event</li>
      </ul>
    </dd>
  </dl>
</script>
