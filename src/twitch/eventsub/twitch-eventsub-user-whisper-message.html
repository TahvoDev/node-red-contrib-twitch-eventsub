<script type="text/javascript">
  RED.nodes.registerType('twitch-eventsub-user-whisper-message', {
    category: 'twitch events',
    color: '#b9a3e3',
    defaults: {
      name:   { value: '' },
      config: { type: 'twitch-api-config', required: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'whisper received',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'whisper received' + (config ? ' (' + (config.name || '') + ')' : '');
    }
  });
</script>

<script type="text/html" data-template-name="twitch-eventsub-user-whisper-message">
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-eventsub-user-whisper-message">
  <p>Fires when a whisper message is received by the user.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      <ul>
        <li><code>id</code> - <i>string</i></li>
        <li><code>userId</code> - <i>string</i></li>
        <li><code>userName</code> - <i>string</i></li>
        <li><code>userDisplayName</code> - <i>string</i></li>
        <li><code>senderUserId</code> - <i>string</i></li>
        <li><code>senderUserName</code> - <i>string</i></li>
        <li><code>senderUserDisplayName</code> - <i>string</i></li>
        <li><code>messageText</code> - <i>string</i></li>
        <li><code>rawEvent</code> - <i>object</i> - the full unmodified event</li>
      </ul>
    </dd>
  </dl>
</script>
