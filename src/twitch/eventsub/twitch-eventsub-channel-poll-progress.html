<script type="text/javascript">
  RED.nodes.registerType('twitch-eventsub-channel-poll-progress', {
    category: 'twitch events',
    color: '#b9a3e3',
    defaults: {
      name:   { value: '' },
      config: { type: 'twitch-api-config', required: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'poll progress',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'poll progress' + (config ? ' (' + (config.name || '') + ')' : '');
    }
  });
</script>

<script type="text/html" data-template-name="twitch-eventsub-channel-poll-progress">
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-eventsub-channel-poll-progress">
  <p>Fires when viewers vote in an ongoing poll.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The poll event data, including <code>rawEvent</code> with the full unmodified event.</dd>
  </dl>
</script>
