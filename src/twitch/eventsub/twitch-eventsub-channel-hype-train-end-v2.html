<script type="text/javascript">
  RED.nodes.registerType('twitch-eventsub-channel-hype-train-end-v2', {
    category: 'twitch events',
    color: '#b9a3e3',
    defaults: {
      name:   { value: '' },
      config: { type: 'twitch-api-config', required: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'hype train v2 end',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'hype train v2 end' + (config ? ' (' + (config.name || '') + ')' : '');
    }
  });
</script>

</script>
