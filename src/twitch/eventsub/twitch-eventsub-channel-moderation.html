<script type="text/javascript">
  RED.nodes.registerType('twitch-eventsub-channel-moderation', {
    category: 'twitch events',
    color: '#b9a3e3',
    defaults: {
      name:   { value: '' },
      config: { type: 'twitch-api-config', required: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'moderation action',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'moderation action' + (config ? ' (' + (config.name || '') + ')' : '');
    }
  });
</script>

<script type="text/html" data-template-name="twitch-eventsub-channel-moderation">
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-eventsub-channel-moderation">
  <p>Fires on any moderation action performed in the channel's chat, such as ban, timeout, unban, clear, delete, raid, mod, vip or warn.</p>
  <p><b>Note:</b> this subscription is made with the broadcaster as both broadcaster and moderator, so only actions performed by the broadcaster themself are reported. Use a switch on <code>payload.moderationAction</code> to tell them apart.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      <ul>
        <li><code>moderationAction</code> - <i>string</i> - the action, e.g. <code>ban</code>, <code>timeout</code>, <code>unban</code>, <code>delete</code>, <code>clear</code>, <code>raid</code>, <code>mod</code>, <code>vip</code>, <code>warn</code></li>
        <li><code>broadcasterId</code> - <i>string</i></li>
        <li><code>broadcasterName</code> - <i>string</i></li>
        <li><code>broadcasterDisplayName</code> - <i>string</i></li>
        <li><code>moderatorId</code> - <i>string</i></li>
        <li><code>moderatorName</code> - <i>string</i></li>
        <li><code>moderatorDisplayName</code> - <i>string</i></li>
        <li><code>userId</code> - <i>string</i> - <code>null</code> unless the action targets a viewer</li>
        <li><code>userName</code> - <i>string</i></li>
        <li><code>userDisplayName</code> - <i>string</i></li>
        <li><code>reason</code> - <i>string</i> - reason given for the action</li>
        <li><code>expiryDate</code> - <i>Date</i> - timeout only</li>
        <li><code>messageId</code> - <i>string</i> - deleted message only</li>
        <li><code>messageText</code> - <i>string</i> - deleted message only</li>
        <li><code>viewerCount</code> - <i>number</i> - raid only</li>
        <li><code>followDurationMinutes</code> - <i>number</i> - followers mode only</li>
        <li><code>waitTimeSeconds</code> - <i>number</i> - slow mode only</li>
        <li><code>moderatorMessage</code> - <i>string</i> - unban request only</li>
        <li><code>isApproved</code> - <i>boolean</i> - unban request only</li>
        <li><code>chatRulesCited</code> - <i>array</i> - warn only</li>
        <li><code>terms</code> - <i>array</i> - automod term changes only</li>
        <li><code>fromAutoMod</code> - <i>boolean</i> - automod term changes only</li>
        <li><code>rawEvent</code> - <i>object</i> - the full unmodified event</li>
      </ul>
    </dd>
  </dl>
</script>
