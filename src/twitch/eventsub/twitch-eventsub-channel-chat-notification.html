<script type="text/javascript">
  RED.nodes.registerType('twitch-eventsub-channel-chat-notification', {
    category: 'twitch events',
    color: '#b9a3e3',
    defaults: {
      name:   { value: '' },
      config: { type: 'twitch-api-config', required: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'chat notification',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'chat notification' + (config ? ' (' + (config.name || '') + ')' : '');
    }
  });
</script>

<script type="text/html" data-template-name="twitch-eventsub-channel-chat-notification">
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-eventsub-channel-chat-notification">
  <p>Fires on chat notifications in the channel: subs, resubs, gift subs, community gifts, raids, announcements, charity donations and bits badge tiers.</p>
  <p><b>Note:</b> this subscription is made with the broadcaster as both broadcaster and user, so only notifications raised by the broadcaster themself are reported. Use a switch on <code>payload.type</code> to tell them apart.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      <ul>
        <li><code>type</code> - <i>string</i> - the notification type, e.g. <code>sub</code>, <code>resub</code>, <code>subgift</code>, <code>anonsubgift</code>, <code>raid</code>, <code>unraid</code>, <code>announcement</code>, <code>charitydonation</code>, <code>bitsbadgetier</code></li>
        <li><code>broadcasterId</code> - <i>string</i></li>
        <li><code>broadcasterName</code> - <i>string</i></li>
        <li><code>broadcasterDisplayName</code> - <i>string</i></li>
        <li><code>chatterId</code> - <i>string</i></li>
        <li><code>chatterName</code> - <i>string</i></li>
        <li><code>chatterDisplayName</code> - <i>string</i></li>
        <li><code>chatterIsAnonymous</code> - <i>boolean</i></li>
        <li><code>messageId</code> - <i>string</i></li>
        <li><code>messageText</code> - <i>string</i></li>
        <li><code>messageParts</code> - <i>array</i></li>
        <li><code>color</code> - <i>string</i></li>
        <li><code>badges</code> - <i>object</i></li>
        <li><code>tier</code> - <i>string</i> - <code>null</code> on most notification types</li>
        <li><code>isPrime</code> - <i>boolean</i></li>
        <li><code>durationMonths</code> - <i>number</i></li>
        <li><code>cumulativeMonths</code> - <i>number</i> - resub only</li>
        <li><code>streakMonths</code> - <i>number</i> - resub only</li>
        <li><code>isGift</code> - <i>boolean</i> - resub only</li>
        <li><code>isGifterAnonymous</code> - <i>boolean</i></li>
        <li><code>gifterId</code> - <i>string</i></li>
        <li><code>gifterName</code> - <i>string</i></li>
        <li><code>gifterDisplayName</code> - <i>string</i></li>
        <li><code>recipientId</code> - <i>string</i> - gift notifications only</li>
        <li><code>recipientName</code> - <i>string</i></li>
        <li><code>recipientDisplayName</code> - <i>string</i></li>
        <li><code>communityGiftId</code> - <i>string</i></li>
        <li><code>cumulativeAmount</code> - <i>number</i></li>
        <li><code>raiderId</code> - <i>string</i> - raid notifications only</li>
        <li><code>raiderName</code> - <i>string</i></li>
        <li><code>raiderDisplayName</code> - <i>string</i></li>
        <li><code>viewerCount</code> - <i>number</i></li>
        <li><code>raiderProfileImageUrl</code> - <i>string</i></li>
        <li><code>charityName</code> - <i>string</i> - charity notifications only</li>
        <li><code>amount</code> - <i>object</i> - charity donation value</li>
        <li><code>newTier</code> - <i>number</i> - bits badge tier notifications only</li>
        <li><code>rawEvent</code> - <i>object</i> - the full unmodified event</li>
      </ul>
    </dd>
  </dl>
</script>
