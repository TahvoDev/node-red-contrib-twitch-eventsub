<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-create-stream-marker', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      description: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'create stream marker',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'create stream marker' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-create-stream-marker">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-description"><i class="fa fa-comment"></i> Description</label>
    <input type="text" id="node-input-description" placeholder="msg.payload overrides this" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-create-stream-marker">
  <p>Adds a marker to a live stream at the current position. The channel's stream must be live. The
    authenticated account must be the broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload | description <span class="property-type">string</span></dt>
    <dd>Optional. Marker description. <code>payload</code> takes priority when it is a string.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>id</code>, <code>creationDate</code>, <code>description</code>, <code>positionInSeconds</code>,
      <code>url</code>, <code>videoId</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:broadcast</code></p>
</script>
