<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-check-user-subscription', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      user:        { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'check user subscription',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'check user subscription' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-check-user-subscription">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-user"><i class="fa fa-search"></i> User</label>
    <input type="text" id="node-input-user" placeholder="blank = authenticated user" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-check-user-subscription">
  <p>Checks whether a user is subscribed to a channel. This uses the authenticated user's token, so
    the checked <b>User</b> should be the account in the config node (blank defaults to it).</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel to check, username or ID.</dd>
    <dt>user <span class="property-type">string</span></dt>
    <dd>Optional. Subscriber username or ID (defaults to the authenticated user).</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | null</span></dt>
    <dd>Null when not subscribed, otherwise <code>broadcasterId</code>,
      <code>broadcasterName</code>, <code>broadcasterDisplayName</code>, <code>isGift</code>,
      <code>tier</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>user:read:subscriptions</code></p>
</script>
