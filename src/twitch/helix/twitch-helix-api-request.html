<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-api-request', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name: { value: '' },
      config: { type: 'twitch-api-config', required: true },
      endpoint: { value: '' },
      action: { value: '' },
      fields: { value: {} }
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'api request',
    label: function () {
      if (this.name) return this.name;
      if (this.endpoint) return 'api request (' + String(this.endpoint).replace('twitch-helix-', '') + ')';
      var config = RED.nodes.node(this.config);
      return 'api request' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      var node = this;
      var registry = [];
      var $endpoint = $('#node-input-endpoint');
      var $action = $('#node-input-action');
      var $fields = $('#helix-fields');

      function esc(value) { return $('<div>').text(String(value)).html(); }

      function inputHtml(field, value) {
        var id = 'helix-field-' + field.name;
        var label = '<label for="' + id + '"><i class="fa ' + esc(field.faIcon || 'fa-font') + '"></i> ' + esc(field.label) + '</label>';
        var hint = field.hint ? ' placeholder="' + esc(field.hint) + '"' : '';
        if (field.kind === 'bool') {
          return '<div class="form-row"><label>&nbsp;</label><input type="checkbox" id="' + id + '" style="display:inline-block;width:auto;"' + (value ? ' checked' : '') + '/></div>';
        }
        if (field.kind === 'select') {
          var options = (field.options || []).map(function (option) {
            var v = typeof option === 'string' ? option : option.value;
            var t = typeof option === 'string' ? option : (option.label || option.value);
            var sel = String(value === undefined || value === null ? '' : value) === String(v) ? ' selected' : '';
            return '<option value="' + esc(v) + '"' + sel + '>' + esc(t) + '</option>';
          }).join('');
          return '<div class="form-row">' + label + '<select id="' + id + '">' + options + '</select></div>';
        }
        var text = value === undefined || value === null ? '' : esc(value);
        return '<div class="form-row">' + label + '<input type="text" id="' + id + '"' + hint + ' value="' + text + '"/></div>';
      }

      function renderFields() {
        var spec = registry.find(function (candidate) { return candidate.type === $endpoint.val(); });
        $fields.empty();
        $action.hide();
        if (!spec) return;

        var fields = spec.fields.slice();
        if (spec.actions) {
          $action.empty();
          Object.keys(spec.actions).forEach(function (name) {
            $action.append('<option value="' + esc(name) + '">' + esc(spec.actions[name].label) + '</option>');
          });
          var actionName = $action.val() || spec.defaultAction || Object.keys(spec.actions)[0];
          $action.val(actionName);
          var chosen = spec.actions[actionName] || spec.actions[Object.keys(spec.actions)[0]];
          fields = fields.concat(chosen.fields);
          $action.show();
        }

        var saved = (node.fields && typeof node.fields === 'object') ? node.fields : {};
        fields.forEach(function (field) { $fields.append(inputHtml(field, saved[field.name])); });
      }

      $endpoint.on('change', renderFields);
      $action.on('change', renderFields);

      $.getJSON('twitch-eventsub/helix/specs', function (data) {
        registry = (data && data.specs) || [];
        var groups = {};
        registry.forEach(function (spec) {
          var resource = spec.resource || 'other';
          (groups[resource] = groups[resource] || []).push(spec);
        });
        $endpoint.empty().append('<option value=""></option>');
        Object.keys(groups).sort().forEach(function (resource) {
          var $group = $('<optgroup label="' + esc(resource) + '"></optgroup>');
          groups[resource].forEach(function (spec) {
            $group.append('<option value="' + esc(spec.type) + '">' + esc(spec.label) + '</option>');
          });
          $endpoint.append($group);
        });
        $endpoint.val(node.endpoint || '');
        $action.val(node.action || '');
        renderFields();
      });
    },
    oneditsave: function () {
      var out = {};
      $('#helix-fields [id^="helix-field-"]').each(function () {
        var name = this.id.replace('helix-field-', '');
        out[name] = this.type === 'checkbox' ? this.checked : $(this).val();
      });
      this.fields = out;
      return true;
    }
  });
</script>

<script type="text/html" data-template-name="twitch-helix-api-request">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-endpoint"><i class="fa fa-plug"></i> Endpoint</label>
    <select id="node-input-endpoint"></select>
  </div>
  <div class="form-row" style="display:none;">
    <label for="node-input-action"><i class="fa fa-bolt"></i> Action</label>
    <select id="node-input-action"></select>
  </div>
  <div id="helix-fields"></div>
</script>

<script type="text/html" data-help-name="twitch-helix-api-request">
  <p>Calls any Twitch Helix endpoint exposed by this package, including the ones without their own palette node.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>endpoint <span class="property-type">string</span></dt>
    <dd>Overrides the selected endpoint; the spec type, e.g. <code>twitch-helix-get-videos</code>.</dd>
    <dt>action <span class="property-type">string</span></dt>
    <dd>Overrides the selected action on an action node.</dd>
  </dl>
  <p>Any field the chosen endpoint declares can also be overridden with <code>msg.&lt;field&gt;</code>, exactly like a dedicated node.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | array</span></dt>
    <dd>The result as a plain object (or array for list endpoints).</dd>
  </dl>
</script>
