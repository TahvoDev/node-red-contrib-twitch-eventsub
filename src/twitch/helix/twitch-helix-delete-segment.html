<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-delete-segment', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      segmentId:   { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'delete segment',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'delete segment' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-delete-segment">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-segmentId"><i class="fa fa-hashtag"></i> Segment ID</label>
    <input type="text" id="node-input-segmentId" placeholder="required" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-delete-segment">
  <p>Removes a segment from a channel's schedule.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>segmentId | id <span class="property-type">string</span></dt>
    <dd>Required. ID of the segment to delete.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>{ segmentId, deleted: true }</code>. Twitch returns no body for a delete.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:schedule</code></p>
</script>
