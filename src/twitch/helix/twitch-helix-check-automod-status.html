<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-check-automod-status', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      message:     { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'check automod status',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'check automod status' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-check-automod-status">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-message"><i class="fa fa-comment"></i> Message</label>
    <input type="text" id="node-input-message" placeholder="msg.payload overrides this" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-check-automod-status">
  <p>Asks Twitch whether a message would be approved or held by AutoMod, without posting it. Feed it a
    string or an array of strings.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload | message | text <span class="property-type">string | array</span></dt>
    <dd>One message or an array of messages to check. <code>payload</code> takes priority.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | array</span></dt>
    <dd>A single result for one message, or an array for several. Each has <code>messageId</code> and
      <code>isPermitted</code> (<code>false</code> means AutoMod would hold it).</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>moderation:read</code></p>
</script>
