<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-start-raid', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      target:      { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'start raid',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'start raid' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-start-raid">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> From channel</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-target"><i class="fa fa-share"></i> Target channel</label>
    <input type="text" id="node-input-target" placeholder="username or ID" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-start-raid">
  <p>Starts a raid from a live channel to another live channel. The authenticated account must be
    the raiding broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. The raiding channel, username or ID (defaults to the authenticated user).</dd>
    <dt>target | targetChannel | to <span class="property-type">string</span></dt>
    <dd>The channel to raid, username or ID. <code>msg.payload</code> (when a string) also works.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>fromBroadcasterId</code>, <code>toBroadcasterId</code>, <code>creationDate</code>,
      <code>targetIsMature</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:raids</code></p>

  <h3>Notes</h3>
  <p>Both channels must be live; Twitch rejects the raid otherwise.</p>
</script>
