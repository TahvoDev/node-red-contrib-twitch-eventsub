<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-clips', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      clipIds:     { value: '' },
      game:        { value: '' },
      limit:       { value: '20' },
      all:         { value: false },
      allMax:      { value: '1000' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get clips',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get clips' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['limit', 'allMax'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-clips">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-clipIds"><i class="fa fa-scissors"></i> Clip IDs</label>
    <input type="text" id="node-input-clipIds" placeholder="comma separated (takes priority)" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-game"><i class="fa fa-gamepad"></i> Game</label>
    <input type="text" id="node-input-game" placeholder="optional: category name or ID" />
  </div>
  <div class="form-row">
    <label for="node-input-limit"><i class="fa fa-list-ol"></i> Limit</label>
    <input type="text" id="node-input-limit" placeholder="20 (max 100)" />
  </div>
  <div class="form-row">
    <label for="node-input-all"><i class="fa fa-download"></i> Get all</label>
    <input type="checkbox" id="node-input-all" style="display:inline-block; width:auto;" />
    <span class="red-ui-help">follows pages up to the maximum</span>
  </div>
  <div class="form-row">
    <label for="node-input-allMax"><i class="fa fa-arrow-up"></i> Max</label>
    <input type="text" id="node-input-allMax" placeholder="1000" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-clips">
  <p>Lists clips by broadcaster, by clip IDs, or by game. When <b>Clip IDs</b> is set the IDs are
    looked up directly; otherwise a <b>Game</b> selects clips for that category, falling back to the
    broadcaster's clips. No scope is required.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>clipIds | ids <span class="property-type">string | array</span></dt>
    <dd>Optional. Comma-separated or array of clip IDs; takes priority and skips paging.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>game | gameId <span class="property-type">string</span></dt>
    <dd>Optional. Category name or ID; a name is looked up automatically.</dd>
    <dt>limit <span class="property-type">number | string</span></dt>
    <dd>Optional. Page size, 1-100 (default 20).</dd>
    <dt>all <span class="property-type">boolean</span></dt>
    <dd>Optional. Follow pages up to <code>allMax</code>.</dd>
    <dt>allMax <span class="property-type">number | string</span></dt>
    <dd>Optional. Cap when <code>all</code> is set (default 1000).</dd>
    <dt>after | cursor <span class="property-type">string</span></dt>
    <dd>Optional. Pagination cursor.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>Clips with <code>id</code>, <code>url</code>, <code>embedUrl</code>, <code>broadcasterId</code>,
      <code>creatorId</code>, <code>videoId</code>, <code>gameId</code>, <code>title</code>,
      <code>views</code>, <code>createdAt</code>, <code>thumbnailUrl</code>, <code>duration</code>,
      <code>vodOffset</code>, <code>isFeatured</code>.</dd>
    <dt>pagination <span class="property-type">object</span></dt>
    <dd><code>{ cursor }</code>.</dd>
    <dt>total <span class="property-type">number</span></dt>
    <dd>Total clips, when Twitch reports it.</dd>
  </dl>

  <h3>Scopes</h3>
  <p>None.</p>
</script>
