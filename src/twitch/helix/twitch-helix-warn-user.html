<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-warn-user', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      user:        { value: '' },
      reason:      { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'warn user',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'warn user' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-warn-user">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-user"><i class="fa fa-exclamation-triangle"></i> User</label>
    <input type="text" id="node-input-user" placeholder="username or ID to warn" />
  </div>
  <div class="form-row">
    <label for="node-input-reason"><i class="fa fa-comment"></i> Reason</label>
    <input type="text" id="node-input-reason" placeholder="shown to the user" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-warn-user">
  <p>Issues a warning to a user. The warning is shown to them in chat, and they must acknowledge it
    before they can chat again. The authenticated account must be a moderator or the broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>targetUserId | targetUser | user <span class="property-type">string</span></dt>
    <dd>The user to warn; a username or an ID.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>reason <span class="property-type">string</span></dt>
    <dd>Optional. The reason shown to the user.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>broadcasterId</code>, <code>moderatorId</code>, <code>userId</code>, <code>reason</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>moderator:manage:warnings</code></p>
</script>
