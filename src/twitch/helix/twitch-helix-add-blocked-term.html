<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-add-blocked-term', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      term:        { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'add blocked term',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'add blocked term' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-add-blocked-term">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-term"><i class="fa fa-ban"></i> Term</label>
    <input type="text" id="node-input-term" placeholder="msg.payload overrides this" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-add-blocked-term">
  <p>Adds a blocked term to a channel. Messages containing it are held for review. The authenticated
    account must be a moderator or the broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload | term | text <span class="property-type">string</span></dt>
    <dd>The term to block. <code>payload</code> takes priority.</dd>
    <dt>termId | id <span class="property-type">string</span></dt>
    <dd>Optional. Used only by <b>remove blocked term</b>.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The created term: <code>id</code>, <code>text</code>, <code>broadcasterId</code>,
      <code>moderatorId</code>, <code>creationDate</code>, <code>expirationDate</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>moderator:manage:blocked_terms</code></p>
</script>
