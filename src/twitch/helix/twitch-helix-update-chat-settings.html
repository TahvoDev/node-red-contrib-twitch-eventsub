<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-update-chat-settings', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:                       { value: '' },
      config:                     { type: 'twitch-api-config', required: true },
      broadcaster:                { value: '' },
      slowMode:                   { value: '' },
      slowModeDelay:              { value: '' },
      followerOnlyMode:           { value: '' },
      followerOnlyModeDelay:      { value: '' },
      subscriberOnlyMode:         { value: '' },
      emoteOnlyMode:              { value: '' },
      uniqueChatMode:             { value: '' },
      nonModeratorChatDelay:      { value: '' },
      nonModeratorChatDelayDuration: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'update chat settings',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'update chat settings' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['slowModeDelay', 'followerOnlyModeDelay', 'nonModeratorChatDelayDuration'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-update-chat-settings">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-slowMode"><i class="fa fa-clock-o"></i> Slow mode</label>
    <select id="node-input-slowMode">
      <option value="">leave unchanged</option>
      <option value="true">on</option>
      <option value="false">off</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-slowModeDelay"><i class="fa fa-hourglass-half"></i> Slow delay (s)</label>
    <input type="text" id="node-input-slowModeDelay" placeholder="leave blank to keep" />
  </div>
  <div class="form-row">
    <label for="node-input-followerOnlyMode"><i class="fa fa-users"></i> Followers only</label>
    <select id="node-input-followerOnlyMode">
      <option value="">leave unchanged</option>
      <option value="true">on</option>
      <option value="false">off</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-followerOnlyModeDelay"><i class="fa fa-hourglass-half"></i> Follower delay (min)</label>
    <input type="text" id="node-input-followerOnlyModeDelay" placeholder="leave blank to keep" />
  </div>
  <div class="form-row">
    <label for="node-input-subscriberOnlyMode"><i class="fa fa-star"></i> Subscribers only</label>
    <select id="node-input-subscriberOnlyMode">
      <option value="">leave unchanged</option>
      <option value="true">on</option>
      <option value="false">off</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-emoteOnlyMode"><i class="fa fa-smile-o"></i> Emote only</label>
    <select id="node-input-emoteOnlyMode">
      <option value="">leave unchanged</option>
      <option value="true">on</option>
      <option value="false">off</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-uniqueChatMode"><i class="fa fa-commenting-o"></i> Unique chat</label>
    <select id="node-input-uniqueChatMode">
      <option value="">leave unchanged</option>
      <option value="true">on</option>
      <option value="false">off</option>
    </select>
  </div>
  <details style="margin-top:10px;">
    <summary>Advanced</summary>
    <div class="form-row">
      <label for="node-input-nonModeratorChatDelay"><i class="fa fa-clock-o"></i> Non-mod delay</label>
      <select id="node-input-nonModeratorChatDelay">
        <option value="">leave unchanged</option>
        <option value="true">on</option>
        <option value="false">off</option>
      </select>
    </div>
    <div class="form-row">
      <label for="node-input-nonModeratorChatDelayDuration"><i class="fa fa-hourglass-half"></i> Non-mod delay (s)</label>
      <input type="text" id="node-input-nonModeratorChatDelayDuration" placeholder="leave blank to keep" />
    </div>
  </details>
</script>

<script type="text/html" data-help-name="twitch-helix-update-chat-settings">
  <p>Changes a channel's chat settings. Only the fields you set are changed — leave a dropdown on
    <b>leave unchanged</b> to keep the current value.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>slowMode, followerOnlyMode, subscriberOnlyMode, emoteOnlyMode, uniqueChatMode, nonModeratorChatDelay <span class="property-type">boolean | string</span></dt>
    <dd>Optional. Turn a mode on or off.</dd>
    <dt>slowModeDelay <span class="property-type">number | string</span></dt>
    <dd>Optional. Slow mode wait in seconds.</dd>
    <dt>followerOnlyModeDelay <span class="property-type">number | string</span></dt>
    <dd>Optional. Follower-only wait in minutes.</dd>
    <dt>nonModeratorChatDelayDuration <span class="property-type">number | string</span></dt>
    <dd>Optional. Non-moderator message delay in seconds.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The updated settings, in the same shape as <b>get chat settings</b>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>moderator:manage:chat_settings</code></p>
</script>
