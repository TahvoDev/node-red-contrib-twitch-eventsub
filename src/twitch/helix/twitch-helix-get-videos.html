<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-videos', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:      { value: '' },
      config:    { type: 'twitch-api-config', required: true },
      user:      { value: '' },
      videoIds:  { value: '' },
      type:      { value: '' },
      period:    { value: '' },
      sort:      { value: '' },
      language:  { value: '' },
      limit:     { value: '20' },
      all:       { value: false },
      allMax:    { value: '1000' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get videos',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get videos' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['limit', 'allMax'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-videos">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-user"><i class="fa fa-user"></i> User</label>
    <input type="text" id="node-input-user" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-videoIds"><i class="fa fa-video-camera"></i> Video IDs</label>
    <input type="text" id="node-input-videoIds" placeholder="comma separated (takes priority)" />
  </div>
  <div class="form-row">
    <label for="node-input-type"><i class="fa fa-filter"></i> Type</label>
    <select id="node-input-type">
      <option value="">any</option>
      <option value="all">all</option>
      <option value="upload">upload</option>
      <option value="archive">archive</option>
      <option value="highlight">highlight</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-period"><i class="fa fa-calendar"></i> Period</label>
    <select id="node-input-period">
      <option value="">any</option>
      <option value="all">all</option>
      <option value="day">day</option>
      <option value="week">week</option>
      <option value="month">month</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-sort"><i class="fa fa-sort"></i> Sort</label>
    <select id="node-input-sort">
      <option value="">time (default)</option>
      <option value="time">time</option>
      <option value="trending">trending</option>
      <option value="views">views</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-language"><i class="fa fa-language"></i> Language</label>
    <input type="text" id="node-input-language" placeholder="optional, e.g. en" />
  </div>
  <div class="form-row">
    <label for="node-input-limit"><i class="fa fa-list-ol"></i> Limit</label>
    <input type="text" id="node-input-limit" placeholder="20 (max 100)" />
  </div>
  <div class="form-row">
    <label for="node-input-all"><i class="fa fa-download"></i> Get all</label>
    <input type="checkbox" id="node-input-all" style="display:inline-block; width:auto;" />
    <span class="red-ui-help">follows pages up to the maximum</span>
  </div>
  <div class="form-row">
    <label for="node-input-allMax"><i class="fa fa-arrow-up"></i> Max</label>
    <input type="text" id="node-input-allMax" placeholder="1000" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-videos">
  <p>Lists videos by user or by video IDs, with optional type, period, sort and language filters.
    When <b>Video IDs</b> is set the IDs are looked up directly and the filters are ignored. No scope
    is required.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>videoIds | ids <span class="property-type">string | array</span></dt>
    <dd>Optional. Comma-separated or array of video IDs; takes priority and skips paging.</dd>
    <dt>user | userId <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID; blank uses the authenticated user.</dd>
    <dt>type | videoType <span class="property-type">string</span></dt>
    <dd>Optional. <code>all</code>, <code>upload</code>, <code>archive</code> or <code>highlight</code>.</dd>
    <dt>period <span class="property-type">string</span></dt>
    <dd>Optional. <code>all</code>, <code>day</code>, <code>week</code> or <code>month</code>.</dd>
    <dt>sort | orderBy <span class="property-type">string</span></dt>
    <dd>Optional. <code>time</code>, <code>trending</code> or <code>views</code>.</dd>
    <dt>language <span class="property-type">string</span></dt>
    <dd>Optional. Language code, e.g. <code>en</code>.</dd>
    <dt>limit <span class="property-type">number | string</span></dt>
    <dd>Optional. Page size, 1-100 (default 20).</dd>
    <dt>all <span class="property-type">boolean</span></dt>
    <dd>Optional. Follow pages up to <code>allMax</code>.</dd>
    <dt>allMax <span class="property-type">number | string</span></dt>
    <dd>Optional. Cap when <code>all</code> is set (default 1000).</dd>
    <dt>after | cursor <span class="property-type">string</span></dt>
    <dd>Optional. Pagination cursor.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>Videos with <code>id</code>, <code>userId</code>, <code>userName</code>, <code>title</code>,
      <code>description</code>, <code>creationDate</code>, <code>publishDate</code>, <code>url</code>,
      <code>thumbnailUrl</code>, <code>isPublic</code>, <code>views</code>, <code>language</code>,
      <code>type</code>, <code>duration</code>, <code>durationInSeconds</code>, <code>streamId</code>,
      <code>mutedSegmentData</code>.</dd>
    <dt>pagination <span class="property-type">object</span></dt>
    <dd><code>{ cursor }</code>.</dd>
    <dt>total <span class="property-type">number</span></dt>
    <dd>Total videos, when Twitch reports it.</dd>
  </dl>

  <h3>Scopes</h3>
  <p>None.</p>
</script>
