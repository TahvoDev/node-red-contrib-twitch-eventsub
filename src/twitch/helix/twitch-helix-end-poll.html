<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-end-poll', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      pollId:      { value: '' },
      showResult:  { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'end poll',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'end poll' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-end-poll">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-pollId"><i class="fa fa-bar-chart"></i> Poll ID</label>
    <input type="text" id="node-input-pollId" placeholder="required" />
  </div>
  <div class="form-row">
    <label for="node-input-showResult"><i class="fa fa-eye"></i> Show result</label>
    <select id="node-input-showResult">
      <option value="">default (show)</option>
      <option value="true">show</option>
      <option value="false">hide</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-end-poll">
  <p>Ends an active channel poll, optionally hiding the result from viewers.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>pollId | id <span class="property-type">string</span></dt>
    <dd>The poll to end. Required.</dd>
    <dt>showResult <span class="property-type">boolean | string</span></dt>
    <dd>Optional. Whether viewers can see the result (default true).</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The ended poll, in the same shape as <b>get polls</b>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:polls</code></p>
</script>
