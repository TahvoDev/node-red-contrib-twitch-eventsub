<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-remove-vip', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      user:        { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'remove vip',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'remove vip' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-remove-vip">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-user"><i class="fa fa-star-o"></i> User</label>
    <input type="text" id="node-input-user" placeholder="username or ID to demote" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-remove-vip">
  <p>Removes a user's VIP status in a channel. The authenticated account must be the broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>targetUserId | targetUser | user <span class="property-type">string</span></dt>
    <dd>The user to demote; a username or an ID.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>broadcasterId</code>, <code>userId</code>, <code>removed: true</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:vips</code></p>
</script>
