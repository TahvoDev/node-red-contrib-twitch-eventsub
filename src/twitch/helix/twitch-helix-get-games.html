<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-games', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:   { value: '' },
      config: { type: 'twitch-api-config', required: true },
      game:   { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get games',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get games' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-games">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-game"><i class="fa fa-gamepad"></i> Game/category</label>
    <input type="text" id="node-input-game" placeholder="name or numeric ID" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-games">
  <p>Looks up a single game/category by name or numeric ID and returns its details.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>game | category | query <span class="property-type">string</span></dt>
    <dd>The name or numeric ID to look up. <code>msg.payload</code> (when a string) also works.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>id</code>, <code>name</code>, <code>boxArtUrl</code>, <code>igdbId</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p>None.</p>

  <h3>Notes</h3>
  <p>Numeric input is treated as a game ID; anything else is looked up by name.</p>
</script>
