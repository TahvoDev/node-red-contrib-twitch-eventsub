<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-send-chat-message', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      message:     { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'send chat message',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'send chat message' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-send-chat-message">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-message"><i class="fa fa-comment"></i> Message</label>
    <input type="text" id="node-input-message" placeholder="msg.payload overrides this" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-send-chat-message">
  <p>Sends a chat message to a channel as the authenticated account. The message text is read from
    <code>msg.payload</code> first, then <code>msg.message</code> or <code>msg.text</code>, then the node field.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload | message | text <span class="property-type">string</span></dt>
    <dd>The message to send. <code>payload</code> takes priority.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Target channel, username or ID.</dd>
    <dt>replyTo | replyParentMessageId <span class="property-type">string</span></dt>
    <dd>Optional. Message ID to reply to.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>id</code>, <code>isSent</code>, <code>dropReasonCode</code>, <code>dropReasonMessage</code>.
      Twitch accepts a dropped message with <code>isSent: false</code>; check it before assuming delivery.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>user:write:chat</code></p>
</script>
