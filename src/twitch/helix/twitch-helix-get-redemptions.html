<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-redemptions', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      rewardId:    { value: '' },
      status:      { value: 'UNFULFILLED' },
      limit:       { value: '20' },
      all:         { value: false },
      allMax:      { value: '1000' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get redemptions',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get redemptions' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['limit', 'allMax'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-redemptions">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-rewardId"><i class="fa fa-gift"></i> Reward ID</label>
    <input type="text" id="node-input-rewardId" placeholder="required" />
  </div>
  <div class="form-row">
    <label for="node-input-status"><i class="fa fa-filter"></i> Status</label>
    <select id="node-input-status">
      <option value="UNFULFILLED">unfulfilled</option>
      <option value="FULFILLED">fulfilled</option>
      <option value="CANCELED">canceled</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-limit"><i class="fa fa-list-ol"></i> Limit</label>
    <input type="text" id="node-input-limit" placeholder="20 (max 100)" />
  </div>
  <div class="form-row">
    <label for="node-input-all"><i class="fa fa-download"></i> Get all</label>
    <input type="checkbox" id="node-input-all" style="display:inline-block; width:auto;" />
    <span class="red-ui-help">follows pages up to the maximum</span>
  </div>
  <div class="form-row">
    <label for="node-input-allMax"><i class="fa fa-arrow-up"></i> Max</label>
    <input type="text" id="node-input-allMax" placeholder="1000" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-redemptions">
  <p>Lists redemptions of a custom Channel Points reward, newest first by default. Set <b>Status</b> to
    filter by fulfilment state.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>rewardId <span class="property-type">string</span></dt>
    <dd>The reward to list redemptions for. Required.</dd>
    <dt>status <span class="property-type">string</span></dt>
    <dd>Optional. <code>UNFULFILLED</code>, <code>FULFILLED</code> or <code>CANCELED</code> (default UNFULFILLED).</dd>
    <dt>newestFirst <span class="property-type">boolean | string</span></dt>
    <dd>Optional. Put the newest redemptions first.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>limit <span class="property-type">number | string</span></dt>
    <dd>Optional. Page size, 1-100 (default 20).</dd>
    <dt>all <span class="property-type">boolean</span></dt>
    <dd>Optional. Follow pages up to <code>allMax</code>.</dd>
    <dt>allMax <span class="property-type">number | string</span></dt>
    <dd>Optional. Cap when <code>all</code> is set (default 1000).</dd>
    <dt>after | cursor <span class="property-type">string</span></dt>
    <dd>Optional. Pagination cursor.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>Redemption objects with <code>id</code>, <code>userId</code>, <code>userName</code>, <code>userInput</code>,
      <code>isFulfilled</code>, <code>isCanceled</code>, <code>redemptionDate</code>, <code>rewardId</code>,
      <code>rewardTitle</code>, <code>rewardPrompt</code> and <code>rewardCost</code>.</dd>
    <dt>pagination <span class="property-type">object</span></dt>
    <dd><code>{ cursor }</code>.</dd>
    <dt>total <span class="property-type">number</span></dt>
    <dd>Total redemptions, when Twitch reports it.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:read:redemptions</code></p>
</script>
