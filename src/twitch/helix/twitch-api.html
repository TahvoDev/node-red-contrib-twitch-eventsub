<script type="text/javascript">
  RED.nodes.registerType('twitch-api', {
    category: 'twitch',
    color: '#b9a3e3',
    defaults: {
      name: { value: '' },
      config: { type: 'twitch-api-config', required: true },
      endpoint: { value: '' },
      action: { value: '' },
      fields: { value: {} }
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'twitch api',
    label: function () {
      if (this.name) return this.name;
      if (this.endpoint) return String(this.endpoint).replace('twitch-helix-', '');
      var config = RED.nodes.node(this.config);
      return 'twitch api' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      var node = this;
      var registry = [];
      var $endpoint = $('#node-input-endpoint');
      var $action = $('#node-input-action');
      var $fields = $('#twitch-api-fields');

      function spec() { return registry.find(function (candidate) { return candidate.type === $endpoint.val(); }); }

      // Build the form with DOM nodes and .text()/.attr() only: never interpolate
      // a registry value or a saved config value into an HTML string.
      function labelFor(field, id) {
        var $label = $('<label>').attr('for', id);
        $label.append($('<i>').addClass('fa ' + (field.faIcon || 'fa-font')));
        $label.append(document.createTextNode(' ' + (field.label || '')));
        return $label;
      }

      function inputHtml(field, value) {
        var id = 'helix-field-' + field.name;
        var $row = $('<div class="form-row">').append(labelFor(field, id));
        if (field.kind === 'bool') {
          var checked = value === true || value === 'true' || value === 1 || value === '1';
          $row.append(
            $('<input type="checkbox">')
              .attr('id', id)
              .css({ display: 'inline-block', width: 'auto' })
              .prop('checked', checked)
          );
          return $row;
        }
        if (field.kind === 'select') {
          var $select = $('<select>').attr('id', id);
          (field.options || []).forEach(function (option) {
            var v = typeof option === 'string' ? option : option.value;
            var t = typeof option === 'string' ? option : (option.label || option.value);
            $select.append($('<option>').attr('value', v).text(t));
          });
          $select.val(value === undefined || value === null ? '' : String(value));
          $row.append($select);
          return $row;
        }
        var $input = $('<input type="text">').attr('id', id);
        if (field.hint) $input.attr('placeholder', field.hint);
        $input.val(value === undefined || value === null ? '' : String(value));
        return $row.append($input);
      }

      function renderEndpoints() {
        $endpoint.empty().append($('<option>'));
        registry
          .slice()
          .sort(function (a, b) { return String(a.label).localeCompare(String(b.label)); })
          .forEach(function (entry) {
            $endpoint.append($('<option>').attr('value', entry.type).text(entry.label));
          });
        $endpoint.val(node.endpoint || '');
      }

      function renderAction() {
        var entry = spec();
        var $row = $('#twitch-api-action-row');
        if (!entry || !entry.actions) { $row.hide(); return; }
        // Keep the saved action: emptying the select throws away the value
        // Node-RED populated from node.action, so read it first.
        var previous = $action.val() || node.action || '';
        $action.empty();
        Object.keys(entry.actions).forEach(function (name) {
          $action.append($('<option>').attr('value', name).text(entry.actions[name].label));
        });
        var actionName = entry.actions[previous]
          ? previous
          : (entry.defaultAction || Object.keys(entry.actions)[0]);
        $action.val(actionName);
        $row.show();
      }

      function renderFields() {
        var entry = spec();
        $fields.empty();
        if (!entry) return;
        var fields = entry.fields.slice();
        if (entry.actions) {
          var actionName = $action.val() || entry.defaultAction || Object.keys(entry.actions)[0];
          var chosen = entry.actions[actionName] || entry.actions[Object.keys(entry.actions)[0]];
          fields = fields.concat(chosen.fields);
        }
        var saved = (node.fields && typeof node.fields === 'object') ? node.fields : {};
        fields.forEach(function (field) { $fields.append(inputHtml(field, saved[field.name])); });
      }

      $endpoint.on('change', function () { renderAction(); renderFields(); });
      $action.on('change', renderFields);

      $.getJSON('twitch-eventsub/helix/endpoints', function (data) {
        registry = (data && data.endpoints) || [];
        renderEndpoints();
        $action.val(node.action || '');
        renderAction();
        renderFields();
      });
    },
    oneditsave: function () {
      var out = {};
      $('#twitch-api-fields [id^="helix-field-"]').each(function () {
        var name = this.id.replace('helix-field-', '');
        out[name] = this.type === 'checkbox' ? this.checked : $(this).val();
      });
      this.fields = out;
      return true;
    }
  });
</script>

<script type="text/html" data-template-name="twitch-api">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-endpoint"><i class="fa fa-plug"></i> Endpoint</label>
    <select id="node-input-endpoint"></select>
  </div>
  <div class="form-row" id="twitch-api-action-row" style="display:none;">
    <label for="node-input-action"><i class="fa fa-bolt"></i> Action</label>
    <select id="node-input-action"></select>
  </div>
  <div id="twitch-api-fields"></div>
</script>

<script type="text/html" data-help-name="twitch-api">
  <p>Calls any Twitch Helix endpoint this package knows. Pick an endpoint; the node renders its fields and action dropdown.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>endpoint <span class="property-type">string</span></dt>
    <dd>Overrides the selected endpoint, e.g. <code>twitch-helix-get-videos</code>.</dd>
    <dt>action <span class="property-type">string</span></dt>
    <dd>Overrides the selected action on an action endpoint.</dd>
  </dl>
  <p>Any field the chosen endpoint declares can also be overridden with <code>msg.&lt;field&gt;</code>, and broadcaster/user fields accept the channel/user aliases.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | array</span></dt>
    <dd>The result as a plain object (or array for list endpoints), with <code>msg.pagination</code>/<code>msg.total</code>.</dd>
  </dl>
</script>
