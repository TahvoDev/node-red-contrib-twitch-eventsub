<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-delete-custom-reward', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      rewardId:    { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'delete custom reward',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'delete custom reward' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-delete-custom-reward">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-rewardId"><i class="fa fa-gift"></i> Reward ID</label>
    <input type="text" id="node-input-rewardId" placeholder="required" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-delete-custom-reward">
  <p>Deletes a custom Channel Points reward. Twitch only allows deleting rewards it created through the API.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>rewardId <span class="property-type">string</span></dt>
    <dd>The reward to delete. Required. Also accepts <code>msg.reward</code> or <code>msg.id</code>.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>{ rewardId, deleted: true }</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:redemptions</code></p>
</script>
