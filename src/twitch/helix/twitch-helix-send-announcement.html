<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-send-announcement', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      message:     { value: '' },
      color:       { value: 'primary' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'send announcement',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'send announcement' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-send-announcement">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-message"><i class="fa fa-bullhorn"></i> Message</label>
    <input type="text" id="node-input-message" placeholder="msg.payload overrides this" />
  </div>
  <div class="form-row">
    <label for="node-input-color"><i class="fa fa-paint-brush"></i> Colour</label>
    <select id="node-input-color">
      <option value="primary">primary</option>
      <option value="blue">blue</option>
      <option value="green">green</option>
      <option value="orange">orange</option>
      <option value="purple">purple</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-send-announcement">
  <p>Sends a highlighted announcement in a channel. Anything other than Twitch's five colours falls back to
    <code>primary</code>, so a message straight from chat in never fails on its hex <code>msg.color</code>.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload | message | text <span class="property-type">string</span></dt>
    <dd>The announcement. <code>payload</code> takes priority.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Target channel, username or ID.</dd>
    <dt>announceColor | color <span class="property-type">string</span></dt>
    <dd>Optional. One of <code>primary</code>, <code>blue</code>, <code>green</code>, <code>orange</code>, <code>purple</code>.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>broadcasterId</code>, <code>message</code>, <code>color</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>moderator:manage:announcements</code></p>
</script>
