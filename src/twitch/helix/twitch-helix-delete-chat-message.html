<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-delete-chat-message', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      messageId:   { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'delete chat message',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'delete chat message' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-delete-chat-message">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-messageId"><i class="fa fa-comment-o"></i> Message ID</label>
    <input type="text" id="node-input-messageId" placeholder="msg.messageId or msg.id overrides this" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-delete-chat-message">
  <p>Deletes one chat message. Wire <b>chat in</b> straight into this node: it emits the message id as
    <code>msg.id</code>, which this node accepts.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>messageId | id <span class="property-type">string</span></dt>
    <dd>The message to delete. <code>msg.messageId</code> takes priority.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>broadcasterId</code>, <code>messageId</code>, <code>deleted: true</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>moderator:manage:chat_messages</code></p>
</script>
