<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-teams', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:     { value: '' },
      config:   { type: 'twitch-api-config', required: true },
      teamId:   { value: '' },
      teamName: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get teams',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get teams' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-teams">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-teamId"><i class="fa fa-hashtag"></i> Team ID</label>
    <input type="text" id="node-input-teamId" placeholder="look up by ID" />
  </div>
  <div class="form-row">
    <label for="node-input-teamName"><i class="fa fa-users"></i> Team name</label>
    <input type="text" id="node-input-teamName" placeholder="look up by name" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-teams">
  <p>Looks up a Twitch team by ID or name and returns its details and members. Twitch has no endpoint
    that lists every team, so supply an ID or name (a numeric <code>msg.team</code> is treated as an ID).</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>teamId <span class="property-type">string</span></dt>
    <dd>Optional. Team ID to look up.</dd>
    <dt>teamName <span class="property-type">string</span></dt>
    <dd>Optional. Team name to look up.</dd>
    <dt>team | payload <span class="property-type">string</span></dt>
    <dd>Optional. Generic team ID or name.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>Zero or one team with <code>id</code>, <code>name</code>, <code>displayName</code>,
      <code>backgroundImageUrl</code>, <code>bannerUrl</code>, <code>creationDate</code>,
      <code>updateDate</code>, <code>info</code>, <code>logoThumbnailUrl</code> and
      <code>members</code>.</dd>
    <dt>total <span class="property-type">number</span></dt>
    <dd>0 or 1.</dd>
  </dl>

  <h3>Scopes</h3>
  <p>None.</p>
</script>
