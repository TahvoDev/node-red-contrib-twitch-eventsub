<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-custom-rewards', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:           { value: '' },
      config:         { type: 'twitch-api-config', required: true },
      broadcaster:    { value: '' },
      rewardIds:      { value: '' },
      onlyManageable: { value: false },
      limit:          { value: '20' },
      all:            { value: false },
      allMax:         { value: '1000' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get custom rewards',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get custom rewards' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['limit', 'allMax'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-custom-rewards">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-rewardIds"><i class="fa fa-gift"></i> Reward IDs</label>
    <input type="text" id="node-input-rewardIds" placeholder="optional: comma separated reward IDs" />
  </div>
  <div class="form-row">
    <label for="node-input-onlyManageable"><i class="fa fa-lock"></i> Manageable only</label>
    <input type="checkbox" id="node-input-onlyManageable" style="display:inline-block; width:auto;" />
  </div>
  <div class="form-row">
    <label for="node-input-limit"><i class="fa fa-list-ol"></i> Limit</label>
    <input type="text" id="node-input-limit" placeholder="20 (max 100)" />
  </div>
  <div class="form-row">
    <label for="node-input-all"><i class="fa fa-download"></i> Get all</label>
    <input type="checkbox" id="node-input-all" style="display:inline-block; width:auto;" />
    <span class="red-ui-help">raise the cap to Max</span>
  </div>
  <div class="form-row">
    <label for="node-input-allMax"><i class="fa fa-arrow-up"></i> Max</label>
    <input type="text" id="node-input-allMax" placeholder="1000" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-custom-rewards">
  <p>Lists a channel's custom Channel Points rewards. Twitch returns the whole list in one response,
    so <b>Limit</b> caps the output and <b>Get all</b> raises the cap to <b>Max</b>; there is no cursor to follow.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>rewardIds | ids <span class="property-type">string | array</span></dt>
    <dd>Optional. Fetch only these reward IDs.</dd>
    <dt>onlyManageable <span class="property-type">boolean | string</span></dt>
    <dd>Optional. Return only rewards the API can manage.</dd>
    <dt>limit <span class="property-type">number | string</span></dt>
    <dd>Optional. Output cap, 1-100 (default 20).</dd>
    <dt>all <span class="property-type">boolean</span></dt>
    <dd>Optional. Raise the cap to <code>allMax</code>.</dd>
    <dt>allMax <span class="property-type">number | string</span></dt>
    <dd>Optional. Cap when <code>all</code> is set (default 1000).</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>Reward objects with <code>id</code>, <code>title</code>, <code>cost</code>, <code>isEnabled</code>,
      <code>isPaused</code>, <code>prompt</code>, <code>backgroundColor</code>, the redemption limits,
      <code>autoFulfill</code> and <code>images</code>.</dd>
    <dt>pagination <span class="property-type">object</span></dt>
    <dd><code>{ cursor: null }</code>.</dd>
    <dt>total <span class="property-type">number</span></dt>
    <dd>Number of rewards returned.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:read:redemptions</code></p>
</script>
