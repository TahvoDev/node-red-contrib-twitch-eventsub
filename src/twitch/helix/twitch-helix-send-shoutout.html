<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-send-shoutout', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:            { value: '' },
      config:          { type: 'twitch-api-config', required: true },
      fromBroadcaster: { value: '' },
      toBroadcaster:   { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'send shoutout',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'send shoutout' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-send-shoutout">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-fromBroadcaster"><i class="fa fa-user"></i> From</label>
    <input type="text" id="node-input-fromBroadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-toBroadcaster"><i class="fa fa-bullhorn"></i> Shout out</label>
    <input type="text" id="node-input-toBroadcaster" placeholder="channel name or ID to shout out" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-send-shoutout">
  <p>Sends a shoutout from one channel to another. The authenticated account must be a moderator of the
    <b>From</b> channel (or be that channel).</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>from <span class="property-type">string</span></dt>
    <dd>Optional. The channel sending the shoutout; defaults to the authenticated user.</dd>
    <dt>to <span class="property-type">string</span></dt>
    <dd>The channel to shout out, username or ID. Overrides the node field.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>fromBroadcasterId</code>, <code>toBroadcasterId</code>, <code>toBroadcasterName</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>moderator:manage:shoutouts</code></p>
</script>
