<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-create-prediction', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:          { value: '' },
      config:        { type: 'twitch-api-config', required: true },
      broadcaster:   { value: '' },
      title:         { value: '' },
      outcomes:      { value: '' },
      autoLockAfter: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'create prediction',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'create prediction' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['autoLockAfter'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-create-prediction">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-title"><i class="fa fa-trophy"></i> Title</label>
    <input type="text" id="node-input-title" placeholder="msg.payload overrides this" />
  </div>
  <div class="form-row">
    <label for="node-input-outcomes"><i class="fa fa-list"></i> Outcomes</label>
    <input type="text" id="node-input-outcomes" placeholder="comma separated, 2 to 10" />
  </div>
  <div class="form-row">
    <label for="node-input-autoLockAfter"><i class="fa fa-clock-o"></i> Lock after (s)</label>
    <input type="text" id="node-input-autoLockAfter" placeholder="1 to 1800, required" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-create-prediction">
  <p>Creates a channel prediction. <code>msg.payload</code> may hold the prediction title. Outcomes are a
    comma separated string or an array, and the lock time is seconds from creation (1 to 1800).</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload | title <span class="property-type">string</span></dt>
    <dd>The prediction title. <code>payload</code> takes priority.</dd>
    <dt>outcomes | options <span class="property-type">string | array</span></dt>
    <dd>2 to 10 outcomes. Required.</dd>
    <dt>autoLockAfter <span class="property-type">number | string</span></dt>
    <dd>Seconds before the prediction auto-locks, 1 to 1800. Required.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The created prediction, in the same shape as <b>get predictions</b>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:predictions</code></p>
</script>
