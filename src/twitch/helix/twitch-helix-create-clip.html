<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-create-clip', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:             { value: '' },
      config:           { type: 'twitch-api-config', required: true },
      broadcaster:      { value: '' },
      createAfterDelay: { value: false },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'create clip',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'create clip' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-create-clip">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-createAfterDelay"><i class="fa fa-clock-o"></i> Create after delay</label>
    <input type="checkbox" id="node-input-createAfterDelay" style="display:inline-block; width:auto;" />
    <span class="red-ui-help">account for the usual stream delay</span>
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-create-clip">
  <p>Creates a clip of a running stream. The stream must be live. The authenticated account must be
    the broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>createAfterDelay <span class="property-type">boolean</span></dt>
    <dd>Optional. Delay the capture to account for stream latency (default false).</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>id</code> of the new clip, plus <code>broadcasterId</code> and <code>createAfterDelay</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>clips:edit</code></p>
</script>
