<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-cheermotes', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get cheermotes',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get cheermotes' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-cheermotes">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Channel</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = global cheermotes only" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-cheermotes">
  <p>Lists the Bits cheermotes Twitch supports, including each tier's images. Leave <b>Channel</b>
    blank for global cheermotes, or set it to a channel to also include its custom cheermotes.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID for channel-specific cheermotes.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>Cheermotes with <code>prefix</code>, <code>type</code>, <code>order</code>,
      <code>lastUpdated</code> and <code>tiers</code> (each with <code>minBits</code>,
      <code>id</code>, <code>color</code>, <code>canCheer</code>, <code>showInBitsCard</code>,
      <code>images</code>).</dd>
    <dt>total <span class="property-type">number</span></dt>
    <dd>Number of cheermotes returned.</dd>
  </dl>

  <h3>Scopes</h3>
  <p>None.</p>
</script>
