<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-get-bits-leaderboard', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      count:       { value: '20' },
      period:      { value: '' },
      startDate:   { value: '' },
      user:        { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'get bits leaderboard',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'get bits leaderboard' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['count'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-get-bits-leaderboard">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-count"><i class="fa fa-list-ol"></i> Count</label>
    <input type="text" id="node-input-count" placeholder="20 (max 100)" />
  </div>
  <div class="form-row">
    <label for="node-input-period"><i class="fa fa-calendar"></i> Period</label>
    <select id="node-input-period">
      <option value="">Twitch default (all)</option>
      <option value="day">day</option>
      <option value="week">week</option>
      <option value="month">month</option>
      <option value="year">year</option>
      <option value="all">all</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-startDate"><i class="fa fa-clock-o"></i> Start date</label>
    <input type="text" id="node-input-startDate" placeholder="optional: RFC3339 date" />
  </div>
  <div class="form-row">
    <label for="node-input-user"><i class="fa fa-search"></i> Center on user</label>
    <input type="text" id="node-input-user" placeholder="optional: show one user" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-get-bits-leaderboard">
  <p>Gets the Bits leaderboard for the authenticated channel. Set <b>Center on user</b> to make sure
    one user appears on the leaderboard, with others ranked around them.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>count <span class="property-type">number | string</span></dt>
    <dd>Optional. Number of entries, 1-100 (default 20).</dd>
    <dt>period <span class="property-type">string</span></dt>
    <dd>Optional. One of day, week, month, year, all.</dd>
    <dt>startDate <span class="property-type">string | Date</span></dt>
    <dd>Optional. Date to start the leaderboard from.</dd>
    <dt>user <span class="property-type">string</span></dt>
    <dd>Optional. Username or ID to center the leaderboard on.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>Entries with <code>userId</code>, <code>userName</code>, <code>userDisplayName</code>,
      <code>rank</code>, <code>amount</code>.</dd>
    <dt>total <span class="property-type">number</span></dt>
    <dd>Total number of people on the requested leaderboard.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>bits:read</code></p>
</script>
