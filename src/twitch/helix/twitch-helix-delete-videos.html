<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-delete-videos', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      videoIds:    { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'delete videos',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'delete videos' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-delete-videos">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-videoIds"><i class="fa fa-video-camera"></i> Video IDs</label>
    <input type="text" id="node-input-videoIds" placeholder="comma separated" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-delete-videos">
  <p>Deletes one or more videos by ID. This cannot be undone. The authenticated account must be the
    broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>videoIds | ids <span class="property-type">string | array</span></dt>
    <dd>Required. Comma-separated or array of video IDs to delete. <code>msg.payload</code> is also accepted.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>broadcasterId</code>, <code>deleted</code> (array of IDs) and <code>count</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:videos</code></p>
</script>
