<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-update-segment', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      segmentId:   { value: '' },
      startDate:   { value: '' },
      timezone:    { value: '' },
      duration:    { value: '' },
      isCanceled:  { value: '' },
      categoryId:  { value: '' },
      title:       { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'update segment',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'update segment' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
    oneditprepare: function () {
      ['duration'].forEach(function (field) {
        $('#node-input-' + field).on('change', function () {
          const value = String($(this).val()).trim();
          if (value && !/^\d+$/.test(value)) RED.notify(field + ' must be a whole number', 'warning');
        });
      });
    },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-update-segment">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-segmentId"><i class="fa fa-hashtag"></i> Segment ID</label>
    <input type="text" id="node-input-segmentId" placeholder="required" />
  </div>
  <div class="form-row">
    <label for="node-input-startDate"><i class="fa fa-calendar"></i> Start date (UTC)</label>
    <input type="text" id="node-input-startDate" placeholder="leave blank to keep" />
  </div>
  <div class="form-row">
    <label for="node-input-timezone"><i class="fa fa-globe"></i> Timezone</label>
    <input type="text" id="node-input-timezone" placeholder="leave blank to keep" />
  </div>
  <div class="form-row">
    <label for="node-input-duration"><i class="fa fa-hourglass-half"></i> Duration (min)</label>
    <input type="text" id="node-input-duration" placeholder="leave blank to keep" />
  </div>
  <div class="form-row">
    <label for="node-input-isCanceled"><i class="fa fa-ban"></i> Canceled</label>
    <select id="node-input-isCanceled">
      <option value="">leave unchanged</option>
      <option value="true">yes</option>
      <option value="false">no</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-categoryId"><i class="fa fa-gamepad"></i> Category</label>
    <input type="text" id="node-input-categoryId" placeholder="leave blank to keep" />
  </div>
  <div class="form-row">
    <label for="node-input-title"><i class="fa fa-comment"></i> Title</label>
    <input type="text" id="node-input-title" placeholder="leave blank to keep" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-update-segment">
  <p>Changes an existing schedule segment. Only the fields you fill in are sent; leave a field
    blank to keep its current value.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
    <dt>segmentId | id <span class="property-type">string</span></dt>
    <dd>Required. ID of the segment to update.</dd>
    <dt>startDate | startTime <span class="property-type">string</span></dt>
    <dd>Optional. New UTC start time.</dd>
    <dt>timezone <span class="property-type">string</span></dt>
    <dd>Optional. IANA timezone.</dd>
    <dt>duration <span class="property-type">number | string</span></dt>
    <dd>Optional. New length in minutes.</dd>
    <dt>isCanceled <span class="property-type">boolean | string</span></dt>
    <dd>Optional. Cancel or un-cancel the segment.</dd>
    <dt>category | categoryId <span class="property-type">string</span></dt>
    <dd>Optional. Category name or ID.</dd>
    <dt>title | payload <span class="property-type">string</span></dt>
    <dd>Optional. New title. A string <code>payload</code> takes priority.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The updated segment: <code>id</code>, <code>startDate</code>, <code>endDate</code>,
      <code>title</code>, <code>cancelEndDate</code>, <code>categoryId</code>,
      <code>categoryName</code>, <code>isRecurring</code>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:schedule</code></p>
</script>
