<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-update-redemption-status', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:          { value: '' },
      config:        { type: 'twitch-api-config', required: true },
      broadcaster:   { value: '' },
      rewardId:      { value: '' },
      redemptionIds: { value: '' },
      status:        { value: 'FULFILLED' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'update redemption status',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'update redemption status' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-update-redemption-status">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-rewardId"><i class="fa fa-gift"></i> Reward ID</label>
    <input type="text" id="node-input-rewardId" placeholder="required" />
  </div>
  <div class="form-row">
    <label for="node-input-redemptionIds"><i class="fa fa-tags"></i> Redemption IDs</label>
    <input type="text" id="node-input-redemptionIds" placeholder="comma separated, required" />
  </div>
  <div class="form-row">
    <label for="node-input-status"><i class="fa fa-check"></i> Status</label>
    <select id="node-input-status">
      <option value="FULFILLED">fulfilled</option>
      <option value="CANCELED">canceled</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-update-redemption-status">
  <p>Marks one or more custom reward redemptions as fulfilled or canceled.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>rewardId <span class="property-type">string</span></dt>
    <dd>The reward the redemptions belong to. Required.</dd>
    <dt>redemptionIds | redemptionId | id <span class="property-type">string | array</span></dt>
    <dd>The redemption(s) to update. Required.</dd>
    <dt>status <span class="property-type">string</span></dt>
    <dd>Optional. <code>FULFILLED</code> (default) or <code>CANCELED</code>.</dd>
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. Channel username or ID.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>The updated redemptions, in the same shape as <b>get redemptions</b>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:redemptions</code></p>
</script>
