<script type="text/javascript">
  RED.nodes.registerType('twitch-helix-update-channel-info', {
    category: 'twitch api',
    color: '#b9a3e3',
    defaults: {
      name:        { value: '' },
      config:      { type: 'twitch-api-config', required: true },
      broadcaster: { value: '' },
      title:       { value: '' },
      game:        { value: '' },
      tags:        { value: '' },
      language:    { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'twitch-icon.svg',
    paletteLabel: 'update channel info',
    label: function () {
      if (this.name) return this.name;
      const config = RED.nodes.node(this.config);
      return 'update channel info' + (config ? ' (' + (config.name || '') + ')' : '');
    },
    labelStyle: function () { return this.name ? 'node_label_italic' : ''; },
  });
</script>

<script type="text/html" data-template-name="twitch-helix-update-channel-info">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> Config</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-broadcaster"><i class="fa fa-user"></i> Broadcaster</label>
    <input type="text" id="node-input-broadcaster" placeholder="blank = authenticated user" />
  </div>
  <div class="form-row">
    <label for="node-input-title"><i class="fa fa-header"></i> Title</label>
    <input type="text" id="node-input-title" placeholder="blank = leave unchanged" />
  </div>
  <div class="form-row">
    <label for="node-input-game"><i class="fa fa-gamepad"></i> Game</label>
    <input type="text" id="node-input-game" placeholder="category name or ID" />
  </div>
  <div class="form-row">
    <label for="node-input-tags"><i class="fa fa-tags"></i> Tags</label>
    <input type="text" id="node-input-tags" placeholder="comma separated, blank = leave unchanged" />
  </div>
  <div class="form-row">
    <label for="node-input-language"><i class="fa fa-language"></i> Language</label>
    <input type="text" id="node-input-language" placeholder="e.g. en" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-helix-update-channel-info">
  <p>Updates a channel's title, game, tags or language. Only the fields you fill in are changed; the node
    fetches and returns the channel afterwards. The authenticated account must be the broadcaster.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>broadcaster <span class="property-type">string</span></dt>
    <dd>Optional. A Twitch username or numeric user ID.</dd>
    <dt>title <span class="property-type">string</span></dt>
    <dd>Optional. Stream title; blank leaves it unchanged.</dd>
    <dt>game | gameId <span class="property-type">string</span></dt>
    <dd>Optional. A category name or numeric game ID; a name is looked up automatically. Blank leaves it unchanged.</dd>
    <dt>tags <span class="property-type">string | array</span></dt>
    <dd>Optional. Comma-separated or array of tags; a non-empty value replaces the tags.</dd>
    <dt>language <span class="property-type">string</span></dt>
    <dd>Optional. Language code, e.g. <code>en</code>; blank leaves it unchanged.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>The updated channel, in the same shape as <b>get channel info</b>.</dd>
  </dl>

  <h3>Scopes</h3>
  <p><code>channel:manage:broadcast</code></p>
</script>
