<script type="text/javascript">
RED.nodes.registerType('twitch-chat-announce', {
  category: 'Twitch Chat (IRC)',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
  },
  inputs: 1,
  outputs: 0,
  icon: 'twitch-chat-announce.svg',
  paletteLabel: 'chat announce',
  label: function () {
    if (this.name) return this.name;
    return this.channel ? 'chat announce (' + this.channel + ')' : 'chat announce';
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-announce">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Default channel (msg.channel overrides)" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-announce">
  <p>Sends a highlighted announcement to a channel.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string</span></dt>
    <dd>The announcement text (Twitch truncates past 500 characters). <b>chat in</b> sets it
    from the chat message, so this node can be wired straight onto one.</dd>

    <dt class="optional">announceColor <span class="property-type">string</span></dt>
    <dd>One of <code>primary</code> (default), <code>blue</code>, <code>green</code>,
    <code>orange</code> or <code>purple</code> — the only colours Twitch accepts for an
    announcement. <code>msg.color</code> is also read, so wiring this straight onto a
    <b>chat in</b> message works: the sender's hex chat colour is not one of these and
    falls back to <code>primary</code>.</dd>

    <dt class="optional">channel <span class="property-type">string</span></dt>
    <dd>Overrides the channel configured on the node.</dd>
  </dl>

  <p>The authenticated account must be a moderator or the broadcaster of the target channel.</p>
</script>
