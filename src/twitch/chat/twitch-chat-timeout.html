<script type="text/javascript">
RED.nodes.registerType('twitch-chat-timeout', {
  category: 'twitch chat (irc)',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
  },
  inputs: 1,
  outputs: 0,
  icon: 'twitch-chat-timeout.svg',
  paletteLabel: 'chat timeout',
  label: function () {
    if (this.name) return this.name;
    return this.channel ? 'chat timeout (' + this.channel + ')' : 'chat timeout';
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-timeout">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Default channel (msg.channel overrides)" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-timeout">
  <p>Times a user out from a channel for a number of seconds.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>targetUser <span class="property-type">string</span></dt>
    <dd>Login name of the user to time out. Required unless <code>msg.targetUserId</code> is set.</dd>

    <dt class="optional">targetUserId <span class="property-type">string</span></dt>
    <dd>Numeric user ID of the user to time out. Takes priority over <code>msg.targetUser</code>.</dd>

    <dt>duration <span class="property-type">number</span></dt>
    <dd>Timeout length in seconds. Clamped to Twitch's maximum of two weeks (1209600).</dd>

    <dt class="optional">reason <span class="property-type">string</span></dt>
    <dd>Reason shown in the moderation log and audit log.</dd>

    <dt class="optional">channel <span class="property-type">string</span></dt>
    <dd>Overrides the channel configured on the node.</dd>
  </dl>

  <p>The authenticated account must be a moderator or the broadcaster of the target channel.</p>
</script>
