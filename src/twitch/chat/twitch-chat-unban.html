<script type="text/javascript">
RED.nodes.registerType('twitch-chat-unban', {
  category: 'twitch chat (irc)',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
  },
  inputs: 1,
  outputs: 0,
  icon: 'twitch-chat-unban.svg',
  paletteLabel: 'chat unban',
  label: function () {
    if (this.name) return this.name;
    return this.channel ? 'chat unban (' + this.channel + ')' : 'chat unban';
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-unban">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Default channel (msg.channel overrides)" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-unban">
  <p>Removes a ban or an active timeout from a user in a channel.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>targetUser <span class="property-type">string</span></dt>
    <dd>Login name of the user to unban. Required unless <code>msg.targetUserId</code> is set.</dd>

    <dt class="optional">targetUserId <span class="property-type">string</span></dt>
    <dd>Numeric user ID of the user to unban. Takes priority over <code>msg.targetUser</code>.</dd>

    <dt class="optional">channel <span class="property-type">string</span></dt>
    <dd>Overrides the channel configured on the node.</dd>
  </dl>

  <p><b>Target vs. sender:</b> the target is never inferred. A missing target is an error rather than
  falling back to the message sender, so a mis-wired flow cannot unban the wrong account.</p>

  <p>The sender (<code>msg.userId</code>, set by <b>chat in</b>) must be a moderator or the
  broadcaster of the channel; this is checked against the Twitch API, not the <code>msg.isMod</code>
  flag. The authenticated account must also be a moderator or the broadcaster of the target channel.</p>
</script>
