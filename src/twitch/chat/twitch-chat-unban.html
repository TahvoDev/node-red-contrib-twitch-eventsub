<script type="text/javascript">
RED.nodes.registerType('twitch-chat-unban', {
  category: 'Twitch Chat',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
  },
  inputs: 1,
  outputs: 0,
  icon: 'twitch-chat-unban.svg',
  paletteLabel: 'chat unban',
  label: function () {
    if (this.name) return this.name;
    return this.channel ? 'chat unban (' + this.channel + ')' : 'chat unban';
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-unban">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Default channel (msg.channel overrides)" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-unban">
  <p>Removes a ban or an active timeout from a user in a channel.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>targetUser <span class="property-type">string</span></dt>
    <dd>Login name (or numeric user ID) of the user to unban. Falls back to <code>msg.user</code> when unset.</dd>

    <dt class="optional">channel <span class="property-type">string</span></dt>
    <dd>Overrides the channel configured on the node.</dd>
  </dl>

  <p><b>Target vs. sender:</b> <b>chat in</b> sets <code>msg.user</code> to the sender of the message.
  Set <code>msg.targetUser</code> before this node if the user to unban is not the message sender.</p>

  <p>The authenticated account must be a moderator or the broadcaster of the target channel.</p>
</script>
