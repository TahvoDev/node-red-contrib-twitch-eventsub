<script type="text/javascript">
RED.nodes.registerType('twitch-chat-delete-message', {
  category: 'Twitch Chat',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
  },
  inputs: 1,
  outputs: 0,
  icon: 'twitch-chat-delete-message.svg',
  paletteLabel: 'chat delete message',
  label: function () {
    if (this.name) return this.name;
    return this.channel ? 'chat delete message (' + this.channel + ')' : 'chat delete message';
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-delete-message">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Default channel (msg.channel overrides)" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-delete-message">
  <p>Deletes a single chat message from a channel.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>messageId <span class="property-type">string</span></dt>
    <dd>The Twitch message ID to delete. <b>chat in</b> emits it as <code>msg.id</code>.</dd>

    <dt class="optional">channel <span class="property-type">string</span></dt>
    <dd>Overrides the channel configured on the node.</dd>
  </dl>

  <p>The authenticated account must be a moderator or the broadcaster of the target channel.</p>
</script>
