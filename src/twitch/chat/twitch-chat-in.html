<script type="text/javascript">
RED.nodes.registerType('twitch-chat-in', {
  category: 'twitch chat (irc)',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
    ignoreOwnMessages: { value: false },
    escape: { value: 'none' },
  },
  inputs: 0,
  outputs: 1,
  outputLabels: ['message'],
  icon: 'twitch-chat-in.svg',
  paletteLabel: 'chat in',
  label: function () {
    if (this.name) return this.name;
    var connection = RED.nodes.node(this.connection);
    return 'chat in' + (connection ? ' (' + (connection.name || '') + ')' : '');
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-in">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Leave blank for all joined channels" />
  </div>

  <div class="form-row">
    <label for="node-input-ignoreOwnMessages"><i class="fa fa-eye-slash"></i> Ignore own messages</label>
    <input type="checkbox" id="node-input-ignoreOwnMessages" style="display:inline-block; width:auto; vertical-align:top;">
  </div>

  <div class="form-row">
    <label for="node-input-escape"><i class="fa fa-shield"></i> Escape text</label>
    <select id="node-input-escape">
      <option value="none">none</option>
      <option value="html">HTML</option>
      <option value="js">JavaScript</option>
      <option value="shell">shell</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-in">
  <p>Emits a message for every chat message received on the joined channels.</p>

  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>Connection <span class="property-type">twitch-chat-connection</span></dt>
    <dd>The chat connection that supplies the message stream.</dd>

    <dt>Channel <span class="property-type">string</span></dt>
    <dd>Optional channel login to filter on. Leave blank to pass messages from every joined channel.</dd>

    <dt>Ignore own messages <span class="property-type">boolean</span></dt>
    <dd>Do not emit messages sent by the connection's own account. Off by default.</dd>

    <dt>Escape text <span class="property-type">none | html | js | shell</span></dt>
    <dd>Escapes <code>msg.payload</code> for a downstream sink, after normalization. <code>none</code>
    (the default) leaves it as plain normalized text. Only the message text is escaped; the routing
    fields (<code>topic</code>, <code>id</code>, <code>user</code>) are never touched.</dd>
  </dl>

  <h3>Escaping</h3>
  <ul>
    <li><b>html</b> encodes <code>&amp; &lt; &gt; " '</code>, enough for HTML text and quoted
    attributes. It is not enough for a URL, CSS, an unquoted attribute or a script.</li>
    <li><b>js</b> escapes a value for a JavaScript string literal, including <code>$</code> and
    <code>&lt;/script&gt;</code>. Use it when a function node builds code, not when it just reads the
    value as data.</li>
    <li><b>shell</b> wraps the value as a single POSIX shell argument. Use it only when the sink runs
    a shell command string — the <b>exec</b> node's default mode. The exec node's <b>spawn</b> mode
    splits on whitespace and strips only double quotes, so it receives the single quotes literally and
    splits the argument; do not use <code>shell</code> there. Quoting stops command injection but not
    argument injection — a payload like <code>-rf</code> is still an option, so put <code>--</code>
    before the value.</li>
    <li>Escaping is sink-specific and applied exactly once: a <b>template</b> or dashboard node that
    escapes on its own will double-escape, so leave this on <code>none</code> there.</li>
    <li>The 10000-character cap is applied before escaping, so an escaped value can be longer than
    10000 characters.</li>
    <li>Only the message text is escaped. If you render <code>displayName</code>, a badge or an emote
    name, escape those too.</li>
  </ul>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string</span></dt>
    <dd>The chat message text.</dd>

    <dt>topic <span class="property-type">string</span></dt>
    <dd>A <code>twitch/chat/{channel}/{user}</code> string built from <code>msg.channel</code> and
    <code>msg.user</code>. The braces are placeholders, not part of the value.</dd>

    <dt>channel <span class="property-type">string</span></dt>
    <dd>The channel login the message was received on.</dd>

    <dt>user <span class="property-type">string</span></dt>
    <dd>The sender's login.</dd>

    <dt>displayName <span class="property-type">string</span></dt>
    <dd>The sender's display name.</dd>

    <dt>userId <span class="property-type">string</span></dt>
    <dd>The sender's numeric Twitch user ID.</dd>

    <dt>id <span class="property-type">string</span></dt>
    <dd>The Twitch message ID, accepted by <b>chat reply</b> and <b>chat delete message</b>.</dd>

    <dt>emotes <span class="property-type">object[]</span></dt>
    <dd>The emotes used in the message, each <code>{ name, positions: string[] }</code>.</dd>

    <dt>badges <span class="property-type">object[]</span></dt>
    <dd>The sender's chat badges, each <code>{ name, version }</code>.</dd>

    <dt>bits <span class="property-type">number</span></dt>
    <dd>The bits cheered, or <code>0</code> when the message is not a cheer.</dd>

    <dt>isCheer <span class="property-type">boolean</span></dt>
    <dd>Whether the message is a cheer.</dd>

    <dt>isMod <span class="property-type">boolean</span></dt>
    <dd>Whether the sender is a moderator.</dd>

    <dt>isSubscriber <span class="property-type">boolean</span></dt>
    <dd>Whether the sender is a subscriber.</dd>

    <dt>isVip <span class="property-type">boolean</span></dt>
    <dd>Whether the sender is a VIP.</dd>

    <dt>isBroadcaster <span class="property-type">boolean</span></dt>
    <dd>Whether the sender is the broadcaster.</dd>

    <dt class="optional">color <span class="property-type">string</span></dt>
    <dd>The sender's chosen chat colour (for example <code>#FF0000</code>), if set.</dd>

    <dt>timestamp <span class="property-type">Date</span></dt>
    <dd>When the node received the message.</dd>
  </dl>

  <p>Every string that came from Twitch is normalized: line breaks become spaces, invisible and
  control characters are stripped, lone surrogates become <code>U+FFFD</code> and the text is
  NFKC-folded. Normalization is not escaping; set <b>Escape text</b> to escape the message text for
  your sink, or escape it yourself after the node. The sender's raw Twurple message is not
  emitted.</p>
</script>
