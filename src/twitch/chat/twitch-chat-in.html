<script type="text/javascript">
RED.nodes.registerType('twitch-chat-in', {
  category: 'Twitch Chat',
  color: '#9146FF',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
  },
  inputs: 0,
  outputs: 1,
  outputLabels: ['message'],
  icon: 'twitch-icon.svg',
  paletteLabel: 'chat in',
  label: function () {
    if (this.name) return this.name;
    var connection = RED.nodes.node(this.connection);
    return 'chat in' + (connection ? ' (' + (connection.name || '') + ')' : '');
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-in">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Leave blank for all joined channels" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-in">
  <p>Emits a message for every chat message received on the joined channels.</p>

  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>Connection <span class="property-type">twitch-chat-connection</span></dt>
    <dd>The chat connection that supplies the message stream.</dd>

    <dt>Channel <span class="property-type">string</span></dt>
    <dd>Optional channel login to filter on. Leave blank to pass messages from every joined channel.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>topic <span class="property-type">string</span></dt>
    <dd><code>twitch/chat/{channel}/{user}</code>.</dd>

    <dt>text / payload <span class="property-type">string</span></dt>
    <dd>The raw chat message text.</dd>

    <dt>user / displayName / userId <span class="property-type">string</span></dt>
    <dd>The sender's login, display name and numeric user ID. Moderation nodes use this as the
    target only when <code>msg.targetUser</code> is not set, so set that first to act on someone else.</dd>

    <dt>id <span class="property-type">string</span></dt>
    <dd>The Twitch message ID, usable with <b>chat reply</b> and <b>chat delete message</b>.</dd>

    <dt>emotes / badges <span class="property-type">object[]</span></dt>
    <dd>Emotes used in the message and the sender's chat badges.</dd>

    <dt>bits / isCheer <span class="property-type">number | boolean</span></dt>
    <dd>Bits cheered and whether the message is a cheer.</dd>

    <dt>isMod / isSubscriber / isVip / isBroadcaster <span class="property-type">boolean</span></dt>
    <dd>The sender's status in the channel.</dd>

    <dt>color <span class="property-type">string</span></dt>
    <dd>The sender's chosen chat color, if set.</dd>
  </dl>
</script>
