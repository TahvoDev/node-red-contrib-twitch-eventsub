<script type="text/javascript">
RED.nodes.registerType('twitch-chat-command', {
  category: 'twitch chat (irc)',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    command: { value: '' },
    prefix: { value: '!' },
    reply: { value: false },
    requireMod: { value: false },
    requireSub: { value: false },
    requireVip: { value: false },
    requireBroadcaster: { value: false },
  },
  inputs: 1,
  outputs: 1,
  icon: 'twitch-chat-command.svg',
  paletteLabel: 'chat command',
  label: function () {
    if (this.name) return this.name;
    return this.command ? (this.prefix || '!') + this.command : 'chat command';
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-command">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-command"><i class="fa fa-terminal"></i> Command</label>
    <input type="text" id="node-input-command" placeholder="hello (matches !hello)" />
  </div>

  <div class="form-row">
    <label for="node-input-prefix"><i class="fa fa-asterisk"></i> Prefix</label>
    <input type="text" id="node-input-prefix" placeholder="!" />
  </div>

  <hr>
  <h4>Reply</h4>

  <div class="form-row">
    <label for="node-input-reply"><i class="fa fa-reply"></i> Reply to the triggering message</label>
    <input type="checkbox" id="node-input-reply" style="display:inline-block; width:auto; vertical-align:top;">
  </div>

  <hr>
  <h4>Permission checks</h4>

  <div class="form-row">
    <label for="node-input-requireBroadcaster"><i class="fa fa-star"></i> Broadcaster only</label>
    <input type="checkbox" id="node-input-requireBroadcaster" style="display:inline-block; width:auto; vertical-align:top;">
  </div>

  <div class="form-row">
    <label for="node-input-requireMod"><i class="fa fa-shield"></i> Mod only</label>
    <input type="checkbox" id="node-input-requireMod" style="display:inline-block; width:auto; vertical-align:top;">
  </div>

  <div class="form-row">
    <label for="node-input-requireSub"><i class="fa fa-heart"></i> Subscriber only</label>
    <input type="checkbox" id="node-input-requireSub" style="display:inline-block; width:auto; vertical-align:top;">
  </div>

  <div class="form-row">
    <label for="node-input-requireVip"><i class="fa fa-diamond"></i> VIP only</label>
    <input type="checkbox" id="node-input-requireVip" style="display:inline-block; width:auto; vertical-align:top;">
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-command">
  <p>Filters the messages from <b>chat in</b> down to one command, and enriches the message for
  the following nodes. Messages that do not match, or that fail a checked requirement, are dropped.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>text / payload <span class="property-type">string</span></dt>
    <dd>The message to match. <code>msg.payload</code> is read first, then <code>msg.text</code>.</dd>

    <dt class="optional">isBroadcaster / isMod / isSubscriber / isVip <span class="property-type">boolean</span></dt>
    <dd>The sender's status, read by the matching permission check.</dd>
  </dl>

  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>command <span class="property-type">string</span></dt>
    <dd>The command without the prefix. Required.</dd>

    <dt>prefix <span class="property-type">string</span></dt>
    <dd>The trigger character. Defaults to <code>!</code>.</dd>

    <dt>Reply to the triggering message</dt>
    <dd>When checked, the message is marked so a following <b>chat reply</b> threads onto the
    command message. Off by default, so a following <b>chat reply</b> sends a plain message.</dd>

    <dt>Permission checks</dt>
    <dd>If any checked requirement is not met, the message is dropped silently.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>command <span class="property-type">string</span></dt>
    <dd>The matched command name.</dd>

    <dt>args <span class="property-type">string[]</span></dt>
    <dd>The space-separated words that followed the command.</dd>

    <dt>reply <span class="property-type">boolean</span></dt>
    <dd>Whether a following <b>chat reply</b> should thread onto the command message. Set from
    the node's Reply option.</dd>
  </dl>

  <p>The full incoming message is passed through, so <code>msg.user</code>, <code>msg.channel</code>,
  <code>msg.id</code> and the rest remain available.</p>

  <p>The trigger is matched case-insensitively at the start of the message, up to a word boundary.</p>
</script>
