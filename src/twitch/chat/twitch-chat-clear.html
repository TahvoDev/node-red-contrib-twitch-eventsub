<script type="text/javascript">
RED.nodes.registerType('twitch-chat-clear', {
  category: 'twitch chat (irc)',
  color: '#b9a3e3',
  defaults: {
    name: { value: '' },
    connection: { type: 'twitch-chat-connection', required: true },
    channel: { value: '' },
  },
  inputs: 1,
  outputs: 0,
  icon: 'twitch-chat-clear.svg',
  paletteLabel: 'chat clear',
  label: function () {
    if (this.name) return this.name;
    return this.channel ? 'chat clear (' + this.channel + ')' : 'chat clear';
  },
  labelStyle: function () {
    return this.name ? 'node_label_italic' : '';
  },
});
</script>

<script type="text/html" data-template-name="twitch-chat-clear">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>

  <div class="form-row">
    <label for="node-input-channel"><i class="fa fa-comments"></i> Channel</label>
    <input type="text" id="node-input-channel" placeholder="Default channel (msg.channel overrides)" />
  </div>
</script>

<script type="text/html" data-help-name="twitch-chat-clear">
  <p>Clears all messages from a channel's chat. Sends at most one clear per channel per minute.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>confirm <span class="property-type">boolean</span></dt>
    <dd>Must be exactly <code>true</code> for the node to act.</dd>

    <dt class="optional">channel <span class="property-type">string</span></dt>
    <dd>Overrides the channel configured on the node.</dd>
  </dl>

  <p>The sender (<code>msg.userId</code>) must be a moderator or the broadcaster of the channel, and
  the authenticated account must be a moderator or the broadcaster of the target channel.</p>
</script>
